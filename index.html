  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes wiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFF3E0;
      background-image: radial-gradient(#FFD9A0 2px, transparent 2px);
      background-size: 26px 26px;
      min-height: 100vh;
      padding: 16px 12px 40px;
      color: #1B1A2E;
      font-size: 13px;
    }

    h1 {
      text-align: center; font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800;
      margin-bottom: 12px; color: #1B1A2E; letter-spacing: -.5px;
    }
    h1 .emoji { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }

    .usage-row {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      gap: 8px; margin: -4px 0 12px;
    }
    .usage-badge {
      /* visibility (no display:none) para reservar el espacio desde el
         primer render — si aparece recién cuando responde el fetch del
         contador, empuja .main-card hacia abajo y dispara un CLS enorme. */
      display: inline-flex; align-items: center; visibility: hidden;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.78rem;
      background: #fff; border: 2px solid #1B1A2E; border-radius: 999px;
      padding: 4px 12px; box-shadow: 2px 2px 0 #1B1A2E; color: #1B1A2E;
    }
    .usage-badge.show { visibility: visible; }
    .btn-share-friends {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.78rem;
      background: #6C5CE7; color: #fff; border: 2px solid #1B1A2E; border-radius: 999px;
      padding: 4px 12px; box-shadow: 2px 2px 0 #1B1A2E; text-decoration: none;
      transition: all .1s;
    }
    .btn-share-friends:hover { background: #5A4BD6; }
    .btn-share-friends:active { transform: translateY(2px); box-shadow: none; }

    .main-card {
      width: 80%;
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border: 2.5px solid #1B1A2E;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 4px 4px 0 #1B1A2E;
    }

    /* ── Top bar ── */
    .top-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .top-bar-row { display: flex; align-items: center; gap: 8px; }
    .top-bar label { font-weight: 700; white-space: nowrap; font-size: 0.82rem; }
    .top-bar input {
      flex: 1; padding: 7px 10px;
      border: 2px solid #1B1A2E; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; color: #1B1A2E;
      background: #FFFDF7;
      outline: none; transition: box-shadow .15s;
    }
    .top-bar-selects select { flex: 1; min-width: 0; }
    .top-bar-actions .btn-share { flex: 1; }

    @media (min-width: 700px) {
      .top-bar { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .top-bar-row { flex: 0 0 auto; }
      .top-bar-total { flex: 1 1 auto; }
      .top-bar-selects select { flex: 0 0 auto; }
      .top-bar-actions { margin-left: auto; }
      .top-bar-actions .btn-share { flex: 0 0 auto; }
    }
    .top-bar input:focus { box-shadow: 0 0 0 3px #FFD9A0; }

    .btn-receipt {
      padding: 7px 11px; background: #EAF6FF; color: #12609E;
      border: 2px solid #1B1A2E; border-radius: 10px; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .btn-receipt:hover { background: #D7EDFF; }
    .btn-receipt.loaded { background: #4DABF7; color: #fff; }
    .btn-receipt.loaded:hover { background: #2b96e8; }

    /* ── Lock mode ── */
    .locked input, .locked select { pointer-events: none !important; background: #F3F0FF !important; color: #4a5568 !important; }
    .locked .btn-add-item, .locked .btn-dup-item, .locked .btn-remove-item,
    .locked .btn-remove-persona, .locked .btn-add-persona,
    .locked .btn-add-shared { display: none !important; }
    .locked #totalBill { pointer-events: none; background: #F3F0FF; }
    .locked .tip-select { pointer-events: none; opacity: .6; }
    .locked .currency-select { pointer-events: none; opacity: .6; }
    .lock-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; background: #B2F2BB; border: 2px solid #1B1A2E;
      border-radius: 12px; margin-bottom: 10px; font-size: 0.8rem; color: #1B1A2E; font-weight: 700;
    }
    .btn-unlock {
      background: #fff; border: 2px solid #1B1A2E; color: #1B1A2E;
      border-radius: 8px; padding: 3px 9px; font-size: 0.72rem; cursor: pointer; font-weight: 700;
    }
    .btn-unlock:hover { background: #FFF3E0; }

    .btn-share {
      padding: 7px 12px; background: #6C5CE7; color: #fff;
      border: 2px solid #1B1A2E; border-radius: 10px; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; box-shadow: 0 2px 0 #1B1A2E; transition: all .1s;
    }
    .btn-share:hover { background: #5A4BD6; }
    .btn-share:active { transform: translateY(2px); box-shadow: none; }
    .btn-reset {
      padding: 7px 9px; background: #fff; color: #1B1A2E;
      border: 2px solid #1B1A2E; border-radius: 10px; font-size: 0.78rem;
      cursor: pointer; transition: all .15s;
    }
    .btn-reset:hover { background: #FFE3E3; border-color: #FF5D5D; }
    .btn-info {
      flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
      background: #fff; color: #4DABF7; font-size: 0.95rem; font-weight: 800;
      border: 2px solid #1B1A2E; border-radius: 999px; cursor: pointer; transition: all .15s;
    }
    .btn-info:hover { background: #EAF6FF; border-color: #4DABF7; }


    /* ── Shared card ── */
    .shared-card {
      border: 2.5px dashed #4DABF7; border-radius: 14px;
      overflow: hidden; margin-bottom: 10px; background: #EAF6FF;
    }
    .shared-header {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; background: #BEE3F8;
      font-family: 'Baloo 2', cursive; font-size: 0.85rem; font-weight: 800; color: #12609E;
    }
    .shared-header span.title { flex: 1; }
    .shared-total-badge {
      font-size: 0.72rem; background: #4DABF7; color: #fff;
      border: 1.5px solid #1B1A2E; border-radius: 999px; padding: 2px 9px; font-weight: 700;
    }

    /* ── Personas ── */
    .personas-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .persona-card {
      border: 2.5px solid #1B1A2E; border-radius: 16px; overflow: hidden;
      box-shadow: 3px 3px 0 #1B1A2E; background: #fff;
    }
    .persona-card.is-payer { border-color: #FFB020; box-shadow: 3px 3px 0 #FFB020; }
    .persona-header { display: flex; align-items: center; gap: 6px; background: #FFFDF7; padding: 7px 10px; }
    .persona-header input {
      flex: 1; border: 2px solid #1B1A2E; background: #fff; border-radius: 8px;
      padding: 4px 8px; font-family: 'Baloo 2', cursive; font-size: 0.85rem; font-weight: 700; color: #1B1A2E;
      outline: none; transition: box-shadow .15s;
    }
    .persona-header input:focus { box-shadow: 0 0 0 3px #FFD9A0; }
    .persona-header input::placeholder { color: #A9A4BD; font-weight: 400; }
    .btn-persona-emoji {
      flex: 0 0 auto; width: 32px; height: 32px; font-size: 1.05rem; line-height: 1;
      border: 2px solid #1B1A2E; border-radius: 9px; background: #FFD9A0; cursor: pointer;
      transition: transform .15s;
    }
    .btn-persona-emoji:hover { transform: rotate(-8deg) scale(1.05); }
    .btn-persona-paid {
      flex: 0 0 auto; background: none; border: none; cursor: pointer;
      font-size: 1.05rem; line-height: 1; opacity: .3; filter: grayscale(1);
      transition: all .15s;
    }
    .btn-persona-paid:hover { opacity: .65; }
    .btn-persona-paid.is-paid { opacity: 1; filter: none; transform: scale(1.1); }
    .btn-remove-persona {
      background: #fff; border: 2px solid #1B1A2E; cursor: pointer; color: #FF5D5D;
      font-size: 0.75rem; font-weight: 700; width: 24px; height: 24px; border-radius: 7px; transition: background .15s;
    }
    .btn-remove-persona:hover { background: #FFE3E3; }

    /* ── Items ── */
    .items-list { padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; }
    .items-header { display: grid; gap: 4px; padding: 0 0 2px; }
    .items-header span { font-size: 0.65rem; color: #6B6684; font-weight: 600; }
    .item-row { display: grid; gap: 4px; align-items: center; }

    /* cols: name | price | dup | del */
    .items-header.cols4, .item-row.cols4 { grid-template-columns: 1fr 88px 22px 22px; }
    .items-header.cols4s, .item-row.cols4s { grid-template-columns: 1fr 88px 22px 22px; }

    .item-row input {
      padding: 4px 7px; border: 2px solid #E4E0F0; border-radius: 8px;
      font-size: 0.78rem; color: #1B1A2E; outline: none; transition: border-color .15s; width: 100%;
      background: #FAFAFE;
    }
    .item-row input:focus { border-color: #6C5CE7; }
    .item-row input::placeholder { color: #A9A4BD; }
    .item-row input.price { font-weight: 700; }

    .btn-dup-item, .btn-remove-item {
      background: none; border: none; cursor: pointer;
      font-size: 0.8rem; line-height: 1; padding: 3px; border-radius: 6px; transition: color .15s;
    }
    .btn-dup-item { color: #6C5CE7; } .btn-dup-item:hover { color: #4a3ec9; background: #F3F0FF; }
    .btn-remove-item { color: #C9C3E0; } .btn-remove-item:hover { color: #FF5D5D; background: #FFE3E3; }

    /* ── Footer ── */
    .persona-footer {
      padding: 5px 10px 8px; display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .btn-add-item {
      background: #fff; border: 2px dashed #C9C3E0; color: #6C5CE7;
      border-radius: 8px; padding: 4px 10px; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all .15s;
    }
    .btn-add-item:hover { border-color: #6C5CE7; background: #F3F0FF; }
    .paid-badge {
      font-size: 0.68rem; font-weight: 700; color: #92400e; background: #FFF3BF;
      border: 1.5px solid #FFB020; border-radius: 999px; padding: 2px 8px; white-space: nowrap;
    }
    .persona-total { font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 800; color: #6C5CE7; white-space: nowrap; }

    /* ── Add persona ── */
    .btn-add-persona {
      width: 100%; margin-top: 10px; padding: 9px;
      background: #6C5CE7; color: #fff; border: 2.5px solid #1B1A2E; border-radius: 13px;
      font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 3px 0 #1B1A2E; transition: all .1s;
    }
    .btn-add-persona:hover { background: #5A4BD6; }
    .btn-add-persona:active { transform: translateY(3px); box-shadow: none; }

    /* ── Resumen ── */
    .summary {
      margin-top: 14px; padding: 12px; border-radius: 16px;
      background: #1B1A2E; color: #fff; border: 2.5px solid #1B1A2E; box-shadow: 4px 4px 0 #FFB020;
    }
    .summary h2 { font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
    .summary-rows { display: flex; flex-direction: column; gap: 5px; }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: #F7F5FF; border-radius: 10px; font-size: 0.8rem;
    }
    .summary-row .name { font-weight: 600; color: #1B1A2E; }
    .summary-row .amount { font-family: 'Baloo 2', cursive; font-weight: 800; color: #1B1A2E; }
    .summary-row-rico { background: #FFD9A0; }
    .summary-shared-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 10px; background: #EAF6FF; border-radius: 10px;
      font-size: 0.75rem; color: #12609E; font-weight: 600;
    }
    .summary-total-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; margin-top: 3px;
    }
    .summary-total-row.ok      { background: #B2F2BB; color: #1B1A2E; }
    .summary-total-row.warning { background: #FFF3BF; color: #1B1A2E; }
    .summary-total-row.error   { background: #FFE3E3; color: #1B1A2E; }
    .badge { font-size: 0.68rem; padding: 2px 9px; border-radius: 999px; font-weight: 700; border: 1.5px solid #1B1A2E; }
    .badge-ok    { background: #12B886; color: #fff; }
    .badge-warn  { background: #FFB020; color: #1B1A2E; }
    .badge-error { background: #FF5D5D; color: #fff; }

    /* ── Shared portion inside persona card ── */
    .shared-portion {
      padding: 5px 10px 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 2px dashed #BEE3F8;
      background: #EAF6FF;
    }
    .shared-portion-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #12609E;
      font-weight: 600;
      padding: 2px 0;
    }
    .shared-portion-name { font-weight: 500; }
    .shared-portion-amt  { font-weight: 800; white-space: nowrap; }

    /* ── Modal compartir ── */
    .modal-overlay {
      display: flex; position: fixed; inset: 0;
      background: rgba(27,26,46,0.6); z-index: 100;
      align-items: flex-end; justify-content: center; padding: 0;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .25s ease-out, visibility 0s linear .25s;
    }
    .modal-overlay.show {
      opacity: 1; visibility: visible; pointer-events: auto;
      transition: opacity .25s ease-out;
    }
    .modal {
      background: #fff; border: 2.5px solid #1B1A2E; border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 -6px 0 #1B1A2E;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-handle {
      width: 40px; height: 5px; background: #E4E0F0; border-radius: 999px;
      margin: 6px auto 10px;
    }

    @media (min-width: 700px) {
      .modal-overlay { align-items: center; padding: 16px; }
      .modal {
        border-bottom: 2.5px solid #1B1A2E; border-radius: 16px;
        padding: 16px; max-height: 90vh; box-shadow: 5px 5px 0 #1B1A2E;
        transform: none;
      }
      .modal-handle { display: none; }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .modal-header h3 { font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 800; color: #1B1A2E; }
    .modal-close {
      background: none; border: none; cursor: pointer; color: #6B6684; font-size: 1rem;
    }
    .modal textarea {
      width: 100%; height: 260px; resize: none;
      border: 2px solid #1B1A2E; border-radius: 10px;
      padding: 10px; font-size: 0.82rem; line-height: 1.6;
      color: #1B1A2E; font-family: inherit; outline: none;
      background: #FAFAFE;
    }
    .btn-copy {
      margin-top: 10px; width: 100%; padding: 9px;
      background: #6C5CE7; color: #fff; border: 2.5px solid #1B1A2E; border-radius: 10px;
      font-family: 'Baloo 2', cursive; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 3px 0 #1B1A2E; transition: all .1s;
    }
    .btn-copy:hover { background: #5A4BD6; }
    .btn-copy:active { transform: translateY(3px); box-shadow: none; }
    .btn-copy.copied { background: #12B886; }

    .modal-relay-section { margin-top: 14px; padding-top: 14px; border-top: 2px dashed #E4E0F0; }
    .modal-relay-section label {
      display: block; font-size: 0.75rem; font-weight: 700; color: #6B6684; margin-bottom: 6px;
    }
    .modal-relay-row { display: flex; gap: 6px; }
    .modal-relay-row input {
      flex: 1; min-width: 0; padding: 8px 10px; border: 2px solid #1B1A2E; border-radius: 8px;
      font-size: 0.72rem; color: #1B1A2E; background: #FAFAFE; outline: none;
    }
    .btn-copy-relay {
      flex: 0 0 auto; padding: 8px 12px; background: #4DABF7; color: #fff;
      border: 2px solid #1B1A2E; border-radius: 8px; font-family: 'Baloo 2', cursive;
      font-weight: 700; font-size: 0.78rem; cursor: pointer; transition: background .15s;
    }
    .btn-copy-relay:hover { background: #2b96e8; }
    .btn-copy-relay.copied { background: #12B886; }
    .modal-relay-warning {
      margin-top: 6px; font-size: 0.7rem; color: #92400e; background: #FFF3BF;
      border-radius: 6px; padding: 4px 8px;
    }
    .modal-done-card {
      text-align: center; padding: 18px 14px; border-radius: 16px;
      background: #FFF3E0; background-image: radial-gradient(#FFD9A0 2px, transparent 2px);
      background-size: 20px 20px;
      border: 2.5px solid #1B1A2E; box-shadow: 3px 3px 0 #1B1A2E;
    }
    .modal-done-title {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.1rem;
      color: #1B1A2E; margin-bottom: 6px; letter-spacing: -.3px;
    }
    .modal-done-subtitle { font-size: 0.8rem; color: #6B6684; font-weight: 500; line-height: 1.4; }

    /* ── Modal ¿cómo funciona? ── */
    .info-steps { list-style: none; display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
    .info-steps li {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 0.85rem; color: #1B1A2E; line-height: 1.4;
    }
    .info-steps .step-num {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 999px;
      background: #6C5CE7; color: #fff; border: 2px solid #1B1A2E;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.75rem;
    }

    /* ── Modal de confirmación/aviso genérico ── */
    .custom-dialog-title {
      font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 800;
      color: #1B1A2E; margin-bottom: 8px;
    }
    .custom-dialog-message { font-size: 0.85rem; color: #1B1A2E; line-height: 1.5; padding-bottom: 16px; }
    .custom-dialog-actions { display: flex; gap: 8px; }
    .btn-dialog-cancel, .btn-dialog-ok {
      flex: 1; padding: 10px; border: 2.5px solid #1B1A2E; border-radius: 10px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      transition: all .1s;
    }
    .btn-dialog-cancel { background: #fff; color: #1B1A2E; }
    .btn-dialog-cancel:hover { background: #FFE3E3; border-color: #FF5D5D; }
    .btn-dialog-ok { background: #6C5CE7; color: #fff; box-shadow: 0 3px 0 #1B1A2E; }
    .btn-dialog-ok:hover { background: #5A4BD6; }
    .btn-dialog-ok:active { transform: translateY(3px); box-shadow: none; }

    /* toast */
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #1B1A2E; color: #fff; padding: 8px 18px; border-radius: 999px;
      font-size: 0.82rem; font-weight: 600; opacity: 0; pointer-events: none;
      transition: opacity .3s; z-index: 999; border: 2px solid #FFB020;
    }
    .toast.show { opacity: 1; }

    /* ── Banner de "agregar a inicio" (PWA) ── */
    .install-banner {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
      background: #1B1A2E; color: #fff;
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 8px 12px; font-size: 0.78rem; font-weight: 600; text-align: center;
      border-top: 2px solid #FFB020;
      transform: translateY(100%); transition: transform .3s ease;
    }
    .install-banner.show { transform: translateY(0); }
    .install-banner span { flex: 1 1 220px; min-width: 0; }
    .install-banner-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
    .btn-install-action {
      background: #FFB020; color: #1B1A2E; border: none; border-radius: 999px;
      padding: 6px 14px; font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.78rem; cursor: pointer;
    }
    .btn-install-dismiss {
      background: none; border: none; color: #C9C3E0; font-size: 1rem; cursor: pointer; padding: 4px;
    }

    /* ── Selectores de moneda y propina ── */
    .currency-select, .tip-select {
      flex: 0 0 auto; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.85rem;
      padding: 8px 10px; border: 2px solid #1B1A2E; border-radius: 10px;
      background: #fff; color: #1B1A2E; cursor: pointer; outline: none;
    }
    .currency-select:focus, .tip-select:focus { box-shadow: 0 0 0 3px #FFD9A0; }

    @media (max-width: 700px) {
      .main-card { width: 100%; }
      .personas-list { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .items-header.cols4, .item-row.cols4,
      .items-header.cols4s, .item-row.cols4s { grid-template-columns: 1fr 74px 20px 20px; }
    }
  </style>
</head>
<body>

<div class="usage-row">

<!-- Modal confirmación/aviso genérico (reemplaza confirm()/alert() nativos) -->
<div class="modal-overlay" id="customDialogOverlay" onclick="if(event.target===this)resolveDialog(false)">

<script src="es.js"></script>
<script>
// ─────────────────────────────────────────────────────
//  ESTADO
// ─────────────────────────────────────────────────────
const LS_KEY = 'dcv4'; // versión 4 — % por persona, no por ítem

let S = {
  total:          '',
  pct:            '',   // propina global (%) para todos los ítems
  currency:       '',   // CLP, USD, ARS, EUR — se autodetecta si viene vacío
  personaCount:   0,
  shared:         [],   // [{id, name, price}]
  personas:       []    // [{id, name, items:[{id, name, price}]}]
};

// ─────────────────────────────────────────────────────
//  PERSISTENCIA
// ─────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.personas)) S = parsed;
    }
  } catch (e) {}
}

async function load() {
  if (location.hash.startsWith('#s=')) {
    // ¿ya hay algo cargado (en memoria o en localStorage) que se perdería?
    let hasExisting = S.personas.length > 0;
    if (!hasExisting) {
      try {
        const raw = localStorage.getItem(LS_KEY);
        const parsed = raw && JSON.parse(raw);
        hasExisting = !!(parsed && Array.isArray(parsed.personas) && parsed.personas.length > 0);
      } catch (e) {}
    }
    try {
      const decoded = await decodeStateFromHash(location.hash.slice(3));
      if (hasExisting && !await customConfirm(T.toast.confirmOverwrite)) {
        history.replaceState(null, '', location.pathname + location.search);
        loadFromLocalStorage();
        return;
      }
      S = decoded;
      save();
      history.replaceState(null, '', location.pathname + location.search);
      showToast(T.toast.loaded);
      return;
    } catch (e) {
      history.replaceState(null, '', location.pathname + location.search);
      showToast(T.toast.loadFailed);
      // sigue al fallback de localStorage abajo
    }
  }
  loadFromLocalStorage();
}

async function exportarArchivo() {
  const total    = parseAmount(document.getElementById('totalBill').value) || 0;
  const n        = S.personas.length;
  const sharedAmt = sharedTotalConPct();
  const sharedPP  = n > 0 ? sharedAmt / n : 0;
  const results   = computeResults(total, sharedPP);
  const sum       = results.reduce((s,r) => s + r.amount, 0);
  const ok        = total > 0 && Math.abs(sum - total) < 1;

  const gPct = parseFloat(S.pct) || 0;

  let txt = T.export.header + '\n';
  txt += '─────────────────────\n';

  if (total > 0) {
    if (gPct > 0) {
      const baseTotal = total / (1 + gPct / 100);
      const propinaMonto = total - baseTotal;
      txt += T.export.subtotal(fmt(baseTotal)) + '\n';
      txt += T.export.tip(gPct, fmt(propinaMonto)) + '\n';
      txt += T.export.total(fmt(total)) + '\n';
    } else {
      txt += T.export.totalNoTip(fmt(total)) + '\n';
    }
  }

  const payer = S.personas.find(p => p.paid);
  if (payer) {
    txt += T.export.paidBy(payer.name || T.persona.removeConfirmFallbackName) + '\n';
  }

  // Compartidos
  const sharedConValor = S.shared.filter(i => parseAmount(i.price) > 0);
  if (sharedConValor.length > 0 && n > 0) {
    txt += '\n' + T.export.sharedHeader(n) + '\n';
    sharedConValor.forEach(i => {
      const pr  = parseAmount(i.price) || 0;
      const tot = pr * (1 + gPct / 100);
      const label = i.name || T.export.sharedItemDefault;
      txt += T.export.sharedItemLine(label, fmt(tot), fmt(tot/n)) + '\n';
    });
  }

  // Por persona
  txt += '\n' + T.export.perPersonHeader + '\n';
  results.forEach((r, idx) => {
    const p = S.personas[idx];
    const isRico = results.every((x,i) => i === idx || x.amount <= r.amount) && results.some(x => Math.abs(x.amount - r.amount) > 1);
    txt += '\n' + T.export.personLine(r.name, isRico, fmt(r.amount)) + '\n';
    let basePersona = 0;
    if (p && p.items.length > 0) {
      p.items.forEach(item => {
        const pr = parseAmount(item.price) || 0;
        if (pr > 0) {
          basePersona += pr;
          const label = item.name || T.export.itemDefault;
          txt += T.export.itemLine(label, fmt(pr)) + '\n';
        }
      });
    }
    if (sharedPP > 0) {
      const baseSharedPP = sharedPP / (1 + gPct / 100);
      basePersona += baseSharedPP;
      txt += T.export.sharedPersonLine(fmt(baseSharedPP)) + '\n';
    }
    if (gPct > 0 && basePersona > 0) {
      const propinaPers = r.amount - basePersona;
      txt += T.export.tipPersonLine(gPct, fmt(propinaPers)) + '\n';
    }
  });

  txt += '\n─────────────────────\n';
  txt += ok ? T.export.matches : T.export.sum(fmt(sum));

  document.getElementById('modalText').value = txt;
  document.getElementById('btnCopy').textContent = T.modal.copy;
  document.getElementById('btnCopy').classList.remove('copied');
  document.getElementById('modalOverlay').classList.add('show');

  // Link "en posta" — solo tiene sentido mientras falte gente por agregar
  // lo suyo. Si la cuenta ya cuadra, no hay nada más que invitar a sumar.
  const relayLabel   = document.getElementById('modalRelayLabel');
  const relayRow     = document.getElementById('modalRelayRow');
  const warningEl    = document.getElementById('modalRelayWarning');
  const doneEl       = document.getElementById('modalRelayDone');

  if (ok) {
    relayLabel.style.display = 'none';
    relayRow.style.display = 'none';
    warningEl.style.display = 'none';
    doneEl.style.display = 'block';
    document.getElementById('modalRelayLink').value = '';
    return;
  }

  doneEl.style.display = 'none';
  relayLabel.style.display = 'block';
  relayRow.style.display = 'flex';

  // Se calcula después de mostrar el modal para que el texto de WhatsApp
  // aparezca al instante sin esperar la compresión.
  const compact = toCompact(S);
  const hashPayload = await encodeStateToHash(compact);
  const url = location.origin + location.pathname + '#s=' + hashPayload;
  document.getElementById('modalRelayLink').value = url;
  if (url.length > 1500) {
    warningEl.textContent = T.modal.relayWarning;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function openInfoModal() {
  document.getElementById('infoModalOverlay').classList.add('show');
}

function closeInfoModal() {
  document.getElementById('infoModalOverlay').classList.remove('show');
}

// ─────────────────────────────────────────────────────
//  MODAL DE CONFIRMACIÓN/AVISO (reemplaza confirm()/alert())
// ─────────────────────────────────────────────────────
let _dialogResolve = null;

function showDialog({ title, message, okText, cancelText, showCancel }) {
  return new Promise(resolve => {
    _dialogResolve = resolve;
    document.getElementById('customDialogTitle').textContent = title;
    document.getElementById('customDialogMessage').textContent = message;
    const cancelBtn = document.getElementById('customDialogCancel');
    cancelBtn.textContent = cancelText || T.dialog.cancel;
    cancelBtn.style.display = showCancel ? 'inline-flex' : 'none';
    document.getElementById('customDialogOk').textContent = okText || T.dialog.ok;
    document.getElementById('customDialogOverlay').classList.add('show');
  });
}

function resolveDialog(result) {
  document.getElementById('customDialogOverlay').classList.remove('show');
  if (_dialogResolve) { _dialogResolve(result); _dialogResolve = null; }
}

function customConfirm(message, opts = {}) {
  return showDialog({ title: T.dialog.confirmTitle, message, showCancel: true, ...opts });
}

function customAlert(message, opts = {}) {
  return showDialog({ title: T.dialog.infoTitle, message, showCancel: false, ...opts });
}

function copiarDetalle() {
  const txt = document.getElementById('modalText').value;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.getElementById('btnCopy');
    btn.textContent = T.modal.copied;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = T.modal.copy; btn.classList.remove('copied'); }, 2000);
  });
  bumpUsageCounter();
}

function copiarRelayLink() {
  const url = document.getElementById('modalRelayLink').value;
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btnCopyRelay');
    btn.textContent = T.modal.copiedRelay;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = T.modal.copyRelay; btn.classList.remove('copied'); }, 2000);
  });
  bumpUsageCounter();
}

// ─────────────────────────────────────────────────────
//  CONTADOR DE USO (público, visible para todos)
// ─────────────────────────────────────────────────────
const COUNTER_NS  = 'transferime-mi-plata-de-una';
const COUNTER_KEY = 'cuentas-compartidas';

function showUsageCounter(n) {
  const box = document.getElementById('usageCounter');
  if (!box || typeof n !== 'number') return;
  box.textContent = `${T.usageCounter.emoji} ${T.usageCounter.suffix(n)}`;
  box.classList.add('show');
}

function loadUsageCounter() {
  fetch(`https://abacus.jasoncameron.dev/get/${COUNTER_NS}/${COUNTER_KEY}`)
    .then(r => r.json())
    .then(d => showUsageCounter(d.value))
    .catch(() => {}); // si el servicio falla, simplemente no se muestra el contador
}

function bumpUsageCounter() {
  fetch(`https://abacus.jasoncameron.dev/hit/${COUNTER_NS}/${COUNTER_KEY}`)
    .then(r => r.json())
    .then(d => showUsageCounter(d.value))
    .catch(() => {});
}

async function resetAll() {
  if (!await customConfirm(T.topbar.confirmReset)) return;
  const keepCurrency = S.currency;
  S = { total: '', pct: '', currency: keepCurrency, personaCount: 0, shared: [], personas: [] };
  save();
  document.getElementById('totalBill').value = '';
  updateTipSelect();
  updateCurrencySelect();
  renderShared();
  await addPersona(); // igual que el arranque inicial: siempre parte con 1 persona
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ─────────────────────────────────────────────────────
//  PWA: service worker + banner de "agregar a inicio"
// ─────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function initInstallBanner() {
  if (isStandalone() || localStorage.getItem('installBannerDismissed')) return;

  const ua = navigator.userAgent.toLowerCase();
  const isIOS = /iphone|ipad|ipod/.test(ua);
  const isAndroid = /android/.test(ua);
  if (!isIOS && !isAndroid) return; // solo tiene sentido en el celular

  const banner = document.getElementById('installBanner');
  const msgEl = document.getElementById('installBannerMsg');
  const actionBtn = document.getElementById('installBannerAction');
  if (!banner || !msgEl || !actionBtn) return;

  if (isIOS) {
    setTimeout(() => {
      if (isStandalone() || localStorage.getItem('installBannerDismissed')) return;
      msgEl.textContent = T.install.iosMessage;
      actionBtn.style.display = 'none';
      banner.classList.add('show');
    }, 2000);
  } else if (isAndroid) {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (localStorage.getItem('installBannerDismissed')) return;
      msgEl.textContent = T.install.androidMessage;
      actionBtn.textContent = T.install.androidButton;
      actionBtn.style.display = 'inline-flex';
      banner.classList.add('show');
    });
  }
}

function installBannerAction() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    dismissInstallBanner();
  });
}

function dismissInstallBanner() {
  const banner = document.getElementById('installBanner');
  if (banner) banner.classList.remove('show');
  localStorage.setItem('installBannerDismissed', '1');
}

function onTotalChange() { S.total = document.getElementById('totalBill').value; save(); recalc(); }

function setPct(v) {
  S.pct = v;
  save();
  updateTipSelect();
  recalc();
}

function updateTipSelect() {
  const sel = document.getElementById('tipSelect');
  if (sel) sel.value = String(parseFloat(S.pct) || 0);
}

// ─────────────────────────────────────────────────────
//  COMPARTIDOS
// ─────────────────────────────────────────────────────
function addSharedItem() {
  S.shared.push({ id: uid(), name: '', price: '' });
  save(); renderShared(); renderPersonas();
}

function dupSharedItem(id) {
  const orig = S.shared.find(i => i.id === id); if (!orig) return;
  S.shared.splice(S.shared.indexOf(orig) + 1, 0, { ...orig, id: uid() });
  save(); renderShared(); renderPersonas();
}

function removeSharedItem(id) {
  S.shared = S.shared.filter(i => i.id !== id);
  save(); renderShared(); renderPersonas();
}

function updateShared(id, field, val) {
  const item = S.shared.find(i => i.id === id);
  if (item) { item[field] = val; save(); renderPersonas(); recalc(); }
}

function renderShared() {
  const c = document.getElementById('sharedList');
  c.innerHTML = '';

  if (S.shared.length > 0) {
    const hdr = el('div', 'items-header cols4s');
    hdr.innerHTML = `<span>${T.shared.columnWhat}</span><span>${T.shared.columnPrice}</span><span></span><span></span>`;
    c.appendChild(hdr);
  }

  S.shared.forEach(item => {
    const row = el('div', 'item-row cols4s');
    row.innerHTML = `
      <input type="text"   placeholder="${T.shared.namePlaceholder}"  value="${esc(item.name)}"
        oninput="updateShared(${item.id},'name',this.value)" />
      <input type="text" inputmode="decimal" class="price" placeholder="${T.shared.columnPrice}" value="${esc(formatAmountInput(item.price))}"
        oninput="updateShared(${item.id},'price',this.value)" onblur="reformatAmountField(this); updateShared(${item.id},'price',this.value);" />
      <button class="btn-dup-item"    onclick="dupSharedItem(${item.id})"    title="${T.shared.dupTitle}">⧉</button>
      <button class="btn-remove-item" onclick="removeSharedItem(${item.id})" title="${T.shared.removeTitle}">✕</button>
    `;
    c.appendChild(row);
  });
}

// ─────────────────────────────────────────────────────
//  PERSONAS
// ─────────────────────────────────────────────────────
function randomAnimal() {
  const emojis = T.persona.animalEmojis;
  return emojis[Math.floor(Math.random() * emojis.length)];
}

async function addPersona() {
  const unnamed = S.personas.find(p => !p.name || !p.name.trim());
  if (unnamed) {
    await customAlert(T.persona.needNameBeforeAdding);
    focusPersonaNameInput(unnamed.id);
    return;
  }
  S.personaCount = (S.personaCount || 0) + 1;
  const id = S.personaCount;
  S.personas.push({ id, name: '', emoji: randomAnimal(), items: [], paid: false });
  save();
  renderPersonas();
  addItem(id);       // auto-agrega un ítem vacío
}

function focusPersonaNameInput(id) {
  const input = document.getElementById('pname-' + id);
  if (!input) return;
  input.scrollIntoView({ behavior: 'smooth', block: 'center' });
  input.focus();
}

function changePersonaEmoji(id) {
  const p = S.personas.find(p => p.id === id);
  if (p) { p.emoji = randomAnimal(); save(); renderPersonas(); }
}

async function removePersona(id) {
  const p = S.personas.find(p => p.id === id);
  const label = (p && p.name) ? p.name : T.persona.removeConfirmFallbackName;
  if (!await customConfirm(T.persona.confirmRemove(label))) return;
  S.personas = S.personas.filter(p => p.id !== id);
  save(); renderPersonas(); recalc();
}

function updatePersonaName(id, val) {
  const p = S.personas.find(p => p.id === id);
  if (p) { p.name = val; save(); recalc(); }
}

function setPagador(id) {
  const wasPaid = !!S.personas.find(p => p.id === id)?.paid;
  S.personas.forEach(p => { p.paid = (p.id === id) && !wasPaid; });
  save(); renderPersonas();
}

// ─────────────────────────────────────────────────────
//  ITEMS
// ─────────────────────────────────────────────────────
function addItem(pid) {
  const p = S.personas.find(p => p.id === pid); if (!p) return;
  p.items.push({ id: uid(), name: '', price: '' });
  save(); renderPersonas();
}

function dupItem(pid, iid) {
  const p = S.personas.find(p => p.id === pid); if (!p) return;
  const orig = p.items.find(i => i.id === iid); if (!orig) return;
  p.items.splice(p.items.indexOf(orig) + 1, 0, { ...orig, id: uid() });
  save(); renderPersonas(); recalc();
}

function removeItem(pid, iid) {
  const p = S.personas.find(p => p.id === pid); if (!p) return;
  p.items = p.items.filter(i => i.id !== iid);
  save(); renderPersonas(); recalc();
}

function updateItem(pid, iid, field, val) {
  const p = S.personas.find(p => p.id === pid); if (!p) return;
  const item = p.items.find(i => i.id === iid); if (!item) return;
  item[field] = val; save(); recalc();
}

// ─────────────────────────────────────────────────────
//  RENDER PERSONAS
// ─────────────────────────────────────────────────────
function renderPersonas() {
  const list = document.getElementById('personasList');
  list.innerHTML = '';
  S.personas.forEach(p => list.appendChild(buildCard(p)));
  recalc();
}

function buildCard(p) {
  const card = el('div', 'persona-card' + (p.paid ? ' is-payer' : ''));

  // header
  if (!p.emoji) p.emoji = randomAnimal();
  const nickPhs = T.persona.nicknamePlaceholders;
  const ph = nickPhs[(p.id - 1) % nickPhs.length];
  const hdr = el('div', 'persona-header');
  hdr.innerHTML = `
    <button class="btn-persona-emoji" onclick="changePersonaEmoji(${p.id})" title="${T.persona.emojiTitle}">${p.emoji}</button>
    <input type="text" id="pname-${p.id}" placeholder="${ph}" value="${esc(p.name)}"
      oninput="updatePersonaName(${p.id},this.value)" />
    <button class="btn-persona-paid${p.paid ? ' is-paid' : ''}" onclick="setPagador(${p.id})"
      title="${p.paid ? T.persona.unmarkPaidTitle : T.persona.markPaidTitle}">👑</button>
    <button class="btn-remove-persona" onclick="removePersona(${p.id})" title="${T.persona.removeTitle}">✕</button>
  `;
  card.appendChild(hdr);

  // items
  const wrap = el('div', 'items-list');
  if (p.items.length > 0) {
    const h = el('div', 'items-header cols4');
    h.innerHTML = `<span>${T.persona.columnWhat}</span><span>${T.persona.columnPrice}</span><span></span><span></span>`;
    wrap.appendChild(h);
  }
  p.items.forEach(item => {
    const row = el('div', 'item-row cols4');
    row.innerHTML = `
      <input type="text"   placeholder="${T.persona.itemPlaceholder}" value="${esc(item.name)}"
        oninput="updateItem(${p.id},${item.id},'name',this.value)" />
      <input type="text" inputmode="decimal" class="price" placeholder="${T.persona.columnPrice}" value="${esc(formatAmountInput(item.price))}"
        oninput="updateItem(${p.id},${item.id},'price',this.value)" onblur="reformatAmountField(this); updateItem(${p.id},${item.id},'price',this.value);" />
      <button class="btn-dup-item"    onclick="dupItem(${p.id},${item.id})"    title="${T.persona.dupTitle}">⧉</button>
      <button class="btn-remove-item" onclick="removeItem(${p.id},${item.id})" title="${T.persona.removeItemTitle}">✕</button>
    `;
    wrap.appendChild(row);
  });
  card.appendChild(wrap);

  // porción de compartidos (si existen)
  const n = S.personas.length;
  const sharedConValor = S.shared.filter(i => parseAmount(i.price) > 0);
  if (sharedConValor.length > 0 && n > 0) {
    const gPct = parseFloat(S.pct) || 0;
    const sp = el('div', 'shared-portion');
    sharedConValor.forEach(item => {
      const pr    = parseAmount(item.price) || 0;
      const total = (pr + pr * gPct / 100) / n;
      const row   = el('div', 'shared-portion-row');
      const label = T.persona.sharedPortion(item.name);
      row.innerHTML = `<span class="shared-portion-name">${esc(label)} (÷${n})</span><span class="shared-portion-amt">${fmt(total)}</span>`;
      sp.appendChild(row);
    });
    card.appendChild(sp);
  }

  // footer
  const foot = el('div', 'persona-footer');
  foot.innerHTML = `
    <button class="btn-add-item" onclick="addItem(${p.id})" title="${T.persona.addItemTitle}">${T.persona.addItem}</button>
    ${p.paid ? `<span class="paid-badge">${T.persona.paidBadge}</span>` : ''}
    <div class="persona-total" id="pt-${p.id}">${fmt(0)}</div>
  `;
  card.appendChild(foot);
  return card;
}

function renderAll() { renderShared(); renderPersonas(); }

// ─────────────────────────────────────────────────────
//  CÁLCULO
// ─────────────────────────────────────────────────────
function sharedTotalConPct() {
  const base = S.shared.reduce((s, i) => s + (parseAmount(i.price) || 0), 0);
  const pct  = parseFloat(S.pct) || 0;
  return base * (1 + pct / 100);
}
function personaConPct(p) {
  const base = p.items.reduce((s, i) => s + (parseAmount(i.price) || 0), 0);
  const pct  = parseFloat(S.pct) || 0;
  return base * (1 + pct / 100);
}
// ─────────────────────────────────────────────────────
//  MONEDA
// ─────────────────────────────────────────────────────
const CURRENCIES = {
  CLP: { locale: 'es-CL', currency: 'CLP', decimals: 0 },
  USD: { locale: 'en-US', currency: 'USD', decimals: 2 },
  ARS: { locale: 'es-AR', currency: 'ARS', decimals: 0 },
  EUR: { locale: 'de-DE', currency: 'EUR', decimals: 2 }
};

function detectCurrency() {
  const lang = (navigator.language || 'es-CL').toLowerCase();
  if (lang.startsWith('es-ar')) return 'ARS';
  if (lang.startsWith('en'))    return 'USD';
  if (lang.startsWith('de') || lang.startsWith('fr') || lang.startsWith('it')) return 'EUR';
  return 'CLP';
}

function hasAnyAmount() {
  if (S.total && String(S.total).trim()) return true;
  if (S.shared.some(i => i.price && String(i.price).trim())) return true;
  if (S.personas.some(p => p.items.some(i => i.price && String(i.price).trim()))) return true;
  return false;
}

async function setCurrency(cur) {
  if (!CURRENCIES[cur]) return;
  if (S.currency === cur) return;

  // No hacemos conversión "de mentira" (relabelear el mismo número como si
  // fuera otra moneda sería engañoso: 20.000 CLP y 20.000 USD son montos
  // muy distintos) ni conversión real (requeriría un tipo de cambio en vivo,
  // que agrega dependencia externa y no siempre refleja lo que de verdad se
  // pagó). Si ya hay montos escritos, avisamos y limpiamos para no arrastrar
  // un número que ya no significa lo mismo.
  if (hasAnyAmount() && !await customConfirm(T.topbar.confirmCurrencyChange)) {
    updateCurrencySelect(); // revierte el <select> a la moneda actual
    return;
  }

  S.currency = cur;
  S.total = '';
  S.shared.forEach(item => { item.price = ''; });
  S.personas.forEach(p => { p.items.forEach(item => { item.price = ''; }); });

  save();
  updateCurrencySelect();
  const totalInput = document.getElementById('totalBill');
  if (totalInput) totalInput.value = '';
  renderAll();
}

function updateCurrencySelect() {
  const sel = document.getElementById('currencySelect');
  if (sel) sel.value = S.currency || 'CLP';
}

function fmt(n) {
  const cfg = CURRENCIES[S.currency] || CURRENCIES.CLP;
  try {
    return new Intl.NumberFormat(cfg.locale, {
      style: 'currency', currency: cfg.currency,
      minimumFractionDigits: cfg.decimals, maximumFractionDigits: cfg.decimals
    }).format(n || 0);
  } catch (e) {
    return '$' + Math.round(n || 0).toLocaleString('es-CL');
  }
}

// ── Inputs de montos formateados según la moneda ──
function currencySeparators(locale) {
  const parts = new Intl.NumberFormat(locale).formatToParts(1234.5);
  return {
    group:   (parts.find(p => p.type === 'group')   || {}).value || ',',
    decimal: (parts.find(p => p.type === 'decimal') || {}).value || '.'
  };
}

function parseAmount(str) {
  if (str == null) return 0;
  let s = String(str).trim();
  if (!s) return 0;
  const cfg = CURRENCIES[S.currency] || CURRENCIES.CLP;
  const { group, decimal } = currencySeparators(cfg.locale);
  s = s.split(group).join('');
  if (decimal !== '.') s = s.split(decimal).join('.');
  s = s.replace(/[^\d.\-]/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

function formatAmountInput(n) {
  const num = typeof n === 'number' ? n : parseAmount(n);
  if (!num && num !== 0) return '';
  const cfg = CURRENCIES[S.currency] || CURRENCIES.CLP;
  try {
    return new Intl.NumberFormat(cfg.locale, {
      minimumFractionDigits: cfg.decimals, maximumFractionDigits: cfg.decimals
    }).format(num);
  } catch (e) {
    return String(num);
  }
}

function reformatAmountField(el) {
  if (!el || !el.value.trim()) return;
  el.value = formatAmountInput(parseAmount(el.value));
}

let receiptDataUrl = null;

function showReceipt(input) {

function verBoleta() {

function closeReceipt() {

// ─────────────────────────────────────────────────────
//  LOCK
// ─────────────────────────────────────────────────────
let manualUnlocked = false;

function applyLock(ok) {
  const card   = document.querySelector('.main-card');
  const banner = document.getElementById('lockBanner');
  if (ok && !manualUnlocked) {
    card.classList.add('locked');
    banner.style.display = 'flex';
  } else {
    card.classList.remove('locked');
    banner.style.display = 'none';
  }
}

function unlock() {
  manualUnlocked = true;
  applyLock(false);
}

function recalc() {
  const total      = parseAmount(document.getElementById('totalBill').value) || 0;
  const n          = S.personas.length;
  const sharedAmt  = sharedTotalConPct();
  const sharedPP   = n > 0 ? sharedAmt / n : 0;

  // badge compartidos
  document.getElementById('sharedBadge').textContent =
    n > 0 && sharedAmt > 0
      ? `${fmt(sharedAmt)} ÷ ${n} = ${fmt(sharedPP)} ${T.shared.perUnit}`
      : fmt(sharedAmt) + ' ' + T.shared.badgeAll;

  // resultados por persona
  const results = computeResults(total, sharedPP);

  // actualizar totales en cards
  S.personas.forEach(p => {
    const el = document.getElementById('pt-' + p.id);
    if (el) {
      const r = results.find(r => r.id === p.id);
      el.textContent = r ? fmt(r.amount) : fmt(0);
    }
  });

  const ok = total > 0 && Math.abs(results.reduce((s,r)=>s+r.amount,0) - total) < 1;
  if (!ok) manualUnlocked = false; // si deja de cuadrar, resetear unlock manual
  applyLock(ok);

  renderSummary(results, total, sharedPP, sharedAmt);
}

function computeResults(total, sharedPP) {
  if (S.personas.length === 0) return [];
  // cada uno paga lo suyo + su % + su parte de lo compartido
  return S.personas.map((p,i) => ({
    id: p.id, name: p.name || T.persona.defaultNames[i % T.persona.defaultNames.length],
    amount: personaConPct(p) + sharedPP
  }));
}

function renderSummary(results, total, sharedPP, sharedAmt) {
  const c = document.getElementById('summaryRows');
  c.innerHTML = '';

  if (results.length === 0) {
    c.innerHTML = `<p style="color:#a0aec0;font-size:.8rem;text-align:center;padding:8px 0;">${T.summary.empty}</p>`;
    return;
  }

  // línea compartido si aplica
  if (sharedAmt > 0 && S.personas.length > 0) {
    const row = el('div', 'summary-shared-row');
    row.innerHTML = `<span>${T.summary.sharedLine(S.personas.length)}</span><span style="font-weight:700">${fmt(sharedPP)} ${T.summary.perUnit}</span>`;
    c.appendChild(row);
  }

  const sum      = results.reduce((s,r) => s + r.amount, 0);
  const maxAmt   = Math.max(...results.map(r => r.amount));
  const richIdx  = results.findIndex(r => r.amount === maxAmt);
  const hayDif   = results.some(r => Math.abs(r.amount - maxAmt) > 1);

  results.forEach((r, i) => {
    const isRico = i === richIdx && hayDif && results.length > 1;
    const row = el('div', 'summary-row' + (isRico ? ' summary-row-rico' : ''));
    row.innerHTML = `
      <span class="name">${esc(r.name)}${isRico ? ' 😂' : ''}</span>
      <span class="amount">${fmt(r.amount)}</span>
    `;
    c.appendChild(row);
  });

  // ── Desglose propina ──
  const gPct = parseFloat(S.pct) || 0;
  if (gPct > 0) {
    const baseSinPropina = results.reduce((s, r) => {
      const p = S.personas.find(px => px.id === r.id);
      const baseP = p ? p.items.reduce((a,i) => a + (parseAmount(i.price)||0), 0) : 0;
      return s + baseP;
    }, 0) + (S.shared.reduce((s,i) => s+(parseAmount(i.price)||0), 0) / (S.personas.length||1)) * S.personas.length;
    const propinaMonto = sum - baseSinPropina;

    const rb = el('div', 'summary-row');
    rb.style.cssText = 'background:#f7fafc;font-size:.78rem;';
    rb.innerHTML = `<span class="name" style="color:#718096">${T.summary.subtotalNoTip}</span><span class="amount" style="color:#718096">${fmt(baseSinPropina)}</span>`;
    c.appendChild(rb);

    const rp = el('div', 'summary-row');
    rp.style.cssText = 'background:#fef9ec;font-size:.78rem;';
    rp.innerHTML = `<span class="name" style="color:#92400e">${T.summary.tipLine(gPct)}</span><span class="amount" style="color:#92400e">+${fmt(propinaMonto)}</span>`;
    c.appendChild(rp);
  }

  const diff    = total > 0 ? Math.abs(sum - total) : null;
  const ok      = diff !== null && diff < 1;
  const noTotal = total === 0;
  const cls     = noTotal ? 'warning' : (ok ? 'ok' : 'error');
  const msg     = noTotal ? T.summary.noTotal : (ok ? T.summary.ok : (sum > total ? T.summary.over : T.summary.under));
  const bCls    = noTotal ? 'badge-warn' : (ok ? 'badge-ok' : 'badge-error');

  const tr = el('div', `summary-total-row ${cls}`);
  tr.innerHTML = `<span>${gPct > 0 ? T.summary.totalWithTip : T.summary.totalNoTip}: ${fmt(sum)}</span><span class="badge ${bCls}">${msg}</span>`;
  c.appendChild(tr);

  if (!noTotal && !ok) {
    const dr = el('div');
    dr.style.cssText = 'font-size:.75rem;color:#718096;text-align:right;padding:3px 9px 0;';
    dr.textContent = sum > total
      ? T.summary.exceededBy(fmt(sum - total))
      : T.summary.missingBy(fmt(total - sum));
    c.appendChild(dr);
  }
}

// ─────────────────────────────────────────────────────
//  UTILIDADES
// ─────────────────────────────────────────────────────
function uid() { return Date.now() + Math.random(); }
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ─────────────────────────────────────────────────────
//  LINK "EN POSTA" (estado comprimido en el hash de la URL)
// ─────────────────────────────────────────────────────

// Esquema compacto: tuplas sin nombres de clave repetidos, e ids nunca
// codificados (se regeneran al decodificar, igual que hace addPersona()).
function toCompact(s) {
  return [
    s.total || '', s.pct || '', s.currency || '',
    (s.shared || []).map(i => [i.name || '', i.price || '']),
    (s.personas || []).map(p => [
      p.name || '', p.emoji || '',
      (p.items || []).map(i => [i.name || '', i.price || ''])
    ])
  ];
}

function fromCompact(c) {
  const [total, pct, currency, sharedT, personasT] = c;
  let n = 0;
  return {
    total: total || '', pct: pct || '', currency: currency || '',
    personaCount: (personasT || []).length,
    shared: (sharedT || []).map(([name, price]) => ({ id: uid(), name: name || '', price: price || '' })),
    personas: (personasT || []).map(([name, emoji, itemsT]) => ({
      id: ++n, name: name || '', emoji: emoji || '',
      items: (itemsT || []).map(([nm, pr]) => ({ id: uid(), name: nm || '', price: pr || '' }))
    }))
  };
}

function toBase64Url(bytes) {
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function fromBase64Url(str) {
  let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b64.length % 4) b64 += '=';
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// 'd' = comprimido con deflate-raw (sin overhead de contenedor gzip),
// 'r' = sin comprimir (fallback para navegadores muy viejos sin CompressionStream).
async function encodeStateToHash(compact) {
  const bytes = new TextEncoder().encode(JSON.stringify(compact));
  if (typeof CompressionStream === 'function') {
    try {
      const cs = new CompressionStream('deflate-raw');
      const writer = cs.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'd' + toBase64Url(new Uint8Array(buf));
    } catch (e) { /* sigue al fallback sin comprimir */ }
  }
  return 'r' + toBase64Url(bytes);
}

async function decodeStateFromHash(payload) {
  const marker = payload[0];
  const bytes = fromBase64Url(payload.slice(1));
  let jsonBytes = bytes;
  if (marker === 'd') {
    if (typeof DecompressionStream !== 'function') throw new Error('unsupported');
    const ds = new DecompressionStream('deflate-raw');
    const writer = ds.writable.getWriter();
    writer.write(bytes);
    writer.close();
    jsonBytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  const compact = JSON.parse(new TextDecoder().decode(jsonBytes));
  if (!Array.isArray(compact)) throw new Error('bad-shape');
  return fromCompact(compact);
}

// ─────────────────────────────────────────────────────
//  TEXTOS ESTÁTICOS (desde es.js) — única fuente de verdad
// ─────────────────────────────────────────────────────
function applyStrings() {
  document.title = T.pageTitle;

  const emojiEl = document.querySelector('h1 .emoji');
  if (emojiEl) emojiEl.textContent = T.header.emoji;
  const titleEl = document.getElementById('headerTitleText');
  if (titleEl) titleEl.textContent = T.header.title;

  const totalLabel = document.getElementById('totalLabel');
  if (totalLabel) totalLabel.title = T.topbar.totalTitle;
  const totalInput = document.getElementById('totalBill');
  if (totalInput) { totalInput.placeholder = T.topbar.totalPlaceholder; totalInput.title = T.topbar.totalTitle; }

  const curSel = document.getElementById('currencySelect');
  if (curSel) {
    curSel.title = T.topbar.currencyTitle;
    curSel.innerHTML = Object.entries(T.topbar.currencyOptions)
      .map(([code, label]) => `<option value="${code}">${esc(label)}</option>`)
      .join('');
  }

  const tipSel = document.getElementById('tipSelect');
  if (tipSel) {
    tipSel.title = T.topbar.tipLabel;
    tipSel.innerHTML = [0, 10, 15, 20].map(v =>
      `<option value="${v}" title="${esc(T.topbar.tipOptionTitle(v))}">${v === 0 ? esc(T.topbar.tipNone) : v + '%'}</option>`
    ).join('');
  }

  const shareBtn = document.querySelector('.btn-share');
  if (shareBtn) { shareBtn.textContent = T.topbar.share; shareBtn.title = T.topbar.shareTitle; }

  const resetBtn = document.querySelector('.btn-reset');
  if (resetBtn) resetBtn.title = T.topbar.resetTitle;

  const shareFriendsBtn = document.getElementById('shareFriendsBtn');
  if (shareFriendsBtn) { shareFriendsBtn.textContent = T.topbar.shareFriends; shareFriendsBtn.title = T.topbar.shareFriendsTitle; }

  // Placeholder invisible con un largo parecido al real, para reservar el
  // espacio del badge antes de que responda el fetch del contador (evita CLS).
  const usageBox = document.getElementById('usageCounter');
  if (usageBox) usageBox.textContent = `${T.usageCounter.emoji} ${T.usageCounter.suffix(0)}`;

  const lockSpan = document.querySelector('.lock-banner span');
  if (lockSpan) lockSpan.textContent = T.lock.banner;
  const unlockBtn = document.querySelector('.btn-unlock');
  if (unlockBtn) { unlockBtn.textContent = T.lock.edit; unlockBtn.title = T.lock.editTitle; }

  const receiptTitle = document.querySelector('#receiptPanel span');
  if (receiptTitle) receiptTitle.textContent = T.receipt.title;
  const receiptCloseBtn = document.querySelector('.receipt-close');
  if (receiptCloseBtn) receiptCloseBtn.title = T.receipt.closeTitle;

  const sharedTitle = document.querySelector('.shared-header .title');
  if (sharedTitle) sharedTitle.textContent = T.shared.title;
  const addSharedBtn = document.querySelector('.btn-add-shared');
  if (addSharedBtn) { addSharedBtn.textContent = T.shared.add; addSharedBtn.title = T.shared.addTitle; }

  const addPersonaBtn = document.querySelector('.btn-add-persona');
  if (addPersonaBtn) { addPersonaBtn.textContent = T.persona.addPersona; addPersonaBtn.title = T.persona.addPersonaTitle; }

  const summaryTitle = document.querySelector('.summary h2');
  if (summaryTitle) summaryTitle.textContent = T.summary.title;

  const modalTitle = document.querySelector('.modal-header h3');
  if (modalTitle) modalTitle.textContent = T.modal.title;
  document.querySelectorAll('.modal-close').forEach(btn => { btn.title = T.modal.closeTitle; });

  const copyBtn = document.getElementById('btnCopy');
  if (copyBtn) copyBtn.textContent = T.modal.copy;

  const relayLabel = document.getElementById('modalRelayLabel');
  if (relayLabel) { relayLabel.textContent = T.modal.relayLabel; relayLabel.title = T.modal.relayLabelTitle; }
  const copyRelayBtn = document.getElementById('btnCopyRelay');
  if (copyRelayBtn) copyRelayBtn.textContent = T.modal.copyRelay;
  const doneTitleEl = document.getElementById('modalDoneTitle');
  if (doneTitleEl) doneTitleEl.textContent = T.modal.doneTitle;
  const doneSubtitleEl = document.getElementById('modalDoneSubtitle');
  if (doneSubtitleEl) doneSubtitleEl.textContent = T.modal.doneSubtitle;

  const infoBtn = document.querySelector('.btn-info');
  if (infoBtn) infoBtn.title = T.info.buttonTitle;
  const infoTitleEl = document.getElementById('infoModalTitle');
  if (infoTitleEl) infoTitleEl.textContent = T.info.title;
  const infoStepsEl = document.getElementById('infoSteps');
  if (infoStepsEl) {
    infoStepsEl.innerHTML = T.info.steps.map((step, i) =>
      `<li><span class="step-num">${i + 1}</span><span>${esc(step)}</span></li>`
    ).join('');
  }
}

// ─────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────
(async () => {
  applyStrings();
  await load();
  loadUsageCounter();

  if (!S.currency) S.currency = detectCurrency();
  updateCurrencySelect();

  if (S.total) document.getElementById('totalBill').value = formatAmountInput(S.total);
  updateTipSelect();

  if (S.personas.length === 0) {
    addPersona();   // siempre arranca con al menos una persona
  } else {
    renderAll();
  }

  initInstallBanner();
})();
</script>

<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
