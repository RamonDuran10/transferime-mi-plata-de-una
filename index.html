  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes wiggle { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFF3E0;
      background-image: radial-gradient(#FFD9A0 2px, transparent 2px);
      background-size: 26px 26px;
      min-height: 100vh;
      padding: 16px 12px 40px;
      color: #1B1A2E;
      font-size: 13px;
    }

    h1 {
      text-align: center; font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800;
      margin-bottom: 12px; color: #1B1A2E; letter-spacing: -.5px;
    }
    h1 .emoji { display: inline-block; animation: wiggle 2.4s ease-in-out infinite; }

    /* ── Loader de página completa ── */
    .page-loader {
      /* por debajo de .modal-overlay (z-index:100) — si algún diálogo necesita
         mostrarse mientras carga (ej. sesión expirada), no debe quedar tapado */
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      background: #FFF3E0; background-image: radial-gradient(#FFD9A0 2px, transparent 2px);
      background-size: 20px 20px;
      opacity: 1; transition: opacity .25s ease-out, visibility 0s linear 0s;
    }
    .page-loader.hide { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s ease-out, visibility 0s linear .25s; }
    .page-loader-spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 4px solid #E4E0F0; border-top-color: #6C5CE7;
      animation: btn-spin .7s linear infinite;
    }
    #pageLoaderText { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.9rem; color: #1B1A2E; }

    .usage-row {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
      gap: 8px; margin: -4px 0 12px;
    }
    .usage-badge {
      /* visibility (no display:none) para reservar el espacio desde el
         primer render — si aparece recién cuando responde el fetch del
         contador, empuja .main-card hacia abajo y dispara un CLS enorme. */
      display: inline-flex; align-items: center; visibility: hidden;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.78rem;
      background: #fff; border: 2px solid #1B1A2E; border-radius: 999px;
      padding: 4px 12px; box-shadow: 2px 2px 0 #1B1A2E; color: #1B1A2E;
    }
    .usage-badge.show { visibility: visible; }
    .btn-share-friends {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.78rem;
      background: #6C5CE7; color: #fff; border: 2px solid #1B1A2E; border-radius: 999px;
      padding: 4px 12px; box-shadow: 2px 2px 0 #1B1A2E; text-decoration: none;
      transition: all .1s;
    }
    .btn-share-friends:hover { background: #5A4BD6; }
    .btn-share-friends:active { transform: translateY(2px); box-shadow: none; }
    .btn-crear-cuenta {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.78rem;
      background: #12B886; color: #fff; border: 2px solid #1B1A2E; border-radius: 999px;
      padding: 4px 12px; box-shadow: 2px 2px 0 #1B1A2E; cursor: pointer;
      transition: all .1s;
    }
    .btn-crear-cuenta:hover { background: #0ca678; }
    .btn-crear-cuenta:active { transform: translateY(2px); box-shadow: none; }

    .main-card {
      width: 80%;
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border: 2.5px solid #1B1A2E;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 4px 4px 0 #1B1A2E;
    }

    /* ── Top bar ── */
    .top-bar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .top-bar-row { display: flex; align-items: center; gap: 8px; }
    .top-bar label { font-weight: 700; white-space: nowrap; font-size: 0.82rem; }
    .top-bar input {
      flex: 1; padding: 7px 10px;
      border: 2px solid #1B1A2E; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; color: #1B1A2E;
      background: #FFFDF7;
      outline: none; transition: box-shadow .15s;
    }
    .top-bar-selects select { flex: 1; min-width: 0; }
    .top-bar-actions .btn-share { flex: 1; }

    @media (min-width: 700px) {
      .top-bar { flex-direction: row; flex-wrap: wrap; align-items: center; }
      .top-bar-row { flex: 0 0 auto; }
      .top-bar-total { flex: 1 1 auto; }
      .top-bar-selects select { flex: 0 0 auto; }
      .top-bar-actions { margin-left: auto; }
      .top-bar-actions .btn-share { flex: 0 0 auto; }
    }
    .top-bar input:focus { box-shadow: 0 0 0 3px #FFD9A0; }

    .btn-receipt {
      padding: 7px 11px; background: #EAF6FF; color: #12609E;
      border: 2px solid #1B1A2E; border-radius: 10px; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .btn-receipt:hover { background: #D7EDFF; }
    .btn-receipt.loaded { background: #4DABF7; color: #fff; }
    .btn-receipt.loaded:hover { background: #2b96e8; }

    /* ── Lock mode ── */
    .locked input, .locked select { pointer-events: none !important; background: #F3F0FF !important; color: #4a5568 !important; }
    .locked .btn-add-item, .locked .btn-dup-item, .locked .btn-remove-item,
    .locked .btn-remove-persona, .locked .btn-add-persona,
    .locked .btn-add-shared { display: none !important; }
    .locked #totalBill { pointer-events: none; background: #F3F0FF; }
    .locked .tip-select { pointer-events: none; opacity: .6; }
    .locked .currency-select { pointer-events: none; opacity: .6; }
    .lock-banner {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 10px; background: #B2F2BB; border: 2px solid #1B1A2E;
      border-radius: 12px; margin-bottom: 10px; font-size: 0.8rem; color: #1B1A2E; font-weight: 700;
    }
    .btn-unlock {
      background: #fff; border: 2px solid #1B1A2E; color: #1B1A2E;
      border-radius: 8px; padding: 3px 9px; font-size: 0.72rem; cursor: pointer; font-weight: 700;
    }
    .btn-unlock:hover { background: #FFF3E0; }

    /* ── Sesión en vivo ── */
    .live-indicator {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: #FFE3E3; border: 2px solid #FF5D5D; border-radius: 12px;
      padding: 7px 10px; margin-bottom: 10px; font-size: 0.78rem; font-weight: 700; color: #1B1A2E;
    }
    .live-indicator #liveIndicatorText {
      flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .btn-leave-live {
      flex: 0 0 auto; background: #fff; border: 2px solid #1B1A2E; border-radius: 8px;
      padding: 3px 9px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: background .15s;
    }
    .btn-leave-live:hover { background: #FFF3E0; }
    /* invitado: total/propina/moneda de solo lectura, pero puede sumar gente/ítems */
    .guest-mode #totalBill,
    .guest-mode .currency-select,
    .guest-mode .tip-select { pointer-events: none !important; opacity: .65; }
    /* host o invitado: "Nueva cuenta" queda oculto para no romper la sesión por accidente */
    .live-mode .btn-reset { display: none !important; }
    .persona-card.pending { opacity: .55; }
    .persona-card.pending .persona-header { justify-content: center; padding: 14px 10px; }

    /* ── Cuenta todavía no creada: formulario deshabilitado ── */
    .not-created .top-bar input,
    .not-created .top-bar select { pointer-events: none !important; opacity: .5; }
    .not-created .top-bar-actions .btn-share,
    .not-created .top-bar-actions .btn-reset { display: none !important; }
    .not-created .shared-card,
    .not-created .personas-list,
    .not-created .btn-add-persona,
    .not-created .summary { opacity: .35; pointer-events: none; filter: grayscale(.4); }

    .btn-share {
      padding: 7px 12px; background: #6C5CE7; color: #fff;
      border: 2px solid #1B1A2E; border-radius: 10px; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; box-shadow: 0 2px 0 #1B1A2E; transition: all .1s;
    }
    .btn-share:hover { background: #5A4BD6; }
    .btn-share:active { transform: translateY(2px); box-shadow: none; }
    .btn-reset {
      padding: 7px 9px; background: #fff; color: #1B1A2E;
      border: 2px solid #1B1A2E; border-radius: 10px; font-size: 0.78rem;
      cursor: pointer; transition: all .15s;
    }
    .btn-reset:hover { background: #FFE3E3; border-color: #FF5D5D; }
    .btn-info {
      flex: 0 0 auto; width: 34px; height: 34px; padding: 0;
      background: #fff; color: #4DABF7; font-size: 0.95rem; font-weight: 800;
      border: 2px solid #1B1A2E; border-radius: 999px; cursor: pointer; transition: all .15s;
    }
    .btn-info:hover { background: #EAF6FF; border-color: #4DABF7; }


    /* ── Shared card ── */
    .shared-card {
      border: 2.5px dashed #4DABF7; border-radius: 14px;
      overflow: hidden; margin-bottom: 10px; background: #EAF6FF;
    }
    .shared-header {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 10px; background: #BEE3F8;
      font-family: 'Baloo 2', cursive; font-size: 0.85rem; font-weight: 800; color: #12609E;
    }
    .shared-header span.title { flex: 1; }
    .shared-total-badge {
      font-size: 0.72rem; background: #4DABF7; color: #fff;
      border: 1.5px solid #1B1A2E; border-radius: 999px; padding: 2px 9px; font-weight: 700;
    }

    /* ── Personas ── */
    .personas-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .persona-card {
      border: 2.5px solid #1B1A2E; border-radius: 16px; overflow: hidden;
      box-shadow: 3px 3px 0 #1B1A2E; background: #fff;
    }
    .persona-card.is-payer { border-color: #FFB020; box-shadow: 3px 3px 0 #FFB020; }
    .persona-header { display: flex; align-items: center; gap: 6px; background: #FFFDF7; padding: 7px 10px; }
    .persona-header input {
      flex: 1; border: 2px solid #1B1A2E; background: #fff; border-radius: 8px;
      padding: 4px 8px; font-family: 'Baloo 2', cursive; font-size: 0.85rem; font-weight: 700; color: #1B1A2E;
      outline: none; transition: box-shadow .15s;
    }
    .persona-header input:focus { box-shadow: 0 0 0 3px #FFD9A0; }
    .persona-header input::placeholder { color: #A9A4BD; font-weight: 400; }
    .btn-persona-emoji {
      flex: 0 0 auto; width: 32px; height: 32px; font-size: 1.05rem; line-height: 1;
      border: 2px solid #1B1A2E; border-radius: 9px; background: #FFD9A0; cursor: pointer;
      transition: transform .15s;
    }
    .btn-persona-emoji:hover { transform: rotate(-8deg) scale(1.05); }
    .btn-persona-paid {
      flex: 0 0 auto; background: none; border: none; cursor: pointer;
      font-size: 1.05rem; line-height: 1; opacity: .3; filter: grayscale(1);
      transition: all .15s;
    }
    .btn-persona-paid:hover { opacity: .65; }
    .btn-persona-paid.is-paid { opacity: 1; filter: none; transform: scale(1.1); }
    .btn-remove-persona {
      background: #fff; border: 2px solid #1B1A2E; cursor: pointer; color: #FF5D5D;
      font-size: 0.75rem; font-weight: 700; width: 24px; height: 24px; border-radius: 7px; transition: background .15s;
    }
    .btn-remove-persona:hover { background: #FFE3E3; }

    /* ── Items ── */
    .items-list { padding: 7px 10px; display: flex; flex-direction: column; gap: 4px; }
    .items-header { display: grid; gap: 4px; padding: 0 0 2px; }
    .items-header span { font-size: 0.65rem; color: #6B6684; font-weight: 600; }
    .item-row { display: grid; gap: 4px; align-items: center; }

    /* cols: name | price | dup | del */
    .items-header.cols4, .item-row.cols4 { grid-template-columns: 1fr 88px 22px 22px; }
    .items-header.cols4s, .item-row.cols4s { grid-template-columns: 1fr 88px 22px 22px; }

    .item-row input {
      padding: 4px 7px; border: 2px solid #E4E0F0; border-radius: 8px;
      font-size: 0.78rem; color: #1B1A2E; outline: none; transition: border-color .15s; width: 100%;
      background: #FAFAFE;
    }
    .item-row input:focus { border-color: #6C5CE7; }
    .item-row input::placeholder { color: #A9A4BD; }
    .item-row input.price { font-weight: 700; }

    .btn-dup-item, .btn-remove-item {
      background: none; border: none; cursor: pointer;
      font-size: 0.8rem; line-height: 1; padding: 3px; border-radius: 6px; transition: color .15s;
    }
    .btn-dup-item { color: #6C5CE7; } .btn-dup-item:hover { color: #4a3ec9; background: #F3F0FF; }
    .btn-remove-item { color: #C9C3E0; } .btn-remove-item:hover { color: #FF5D5D; background: #FFE3E3; }

    /* ── Footer ── */
    .persona-footer {
      padding: 5px 10px 8px; display: flex; align-items: center;
      justify-content: space-between; gap: 8px;
    }
    .btn-add-item {
      background: #fff; border: 2px dashed #C9C3E0; color: #6C5CE7;
      border-radius: 8px; padding: 4px 10px; font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all .15s;
    }
    .btn-add-item:hover { border-color: #6C5CE7; background: #F3F0FF; }
    .paid-badge {
      font-size: 0.68rem; font-weight: 700; color: #92400e; background: #FFF3BF;
      border: 1.5px solid #FFB020; border-radius: 999px; padding: 2px 8px; white-space: nowrap;
    }
    .persona-total { font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 800; color: #6C5CE7; white-space: nowrap; }

    /* ── Add persona ── */
    .btn-add-persona {
      width: 100%; margin-top: 10px; padding: 9px;
      background: #6C5CE7; color: #fff; border: 2.5px solid #1B1A2E; border-radius: 13px;
      font-family: 'Baloo 2', cursive; font-size: 0.9rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 3px 0 #1B1A2E; transition: all .1s;
    }
    .btn-add-persona:hover { background: #5A4BD6; }
    .btn-add-persona:active { transform: translateY(3px); box-shadow: none; }

    /* ── Resumen ── */
    .summary {
      margin-top: 14px; padding: 12px; border-radius: 16px;
      background: #1B1A2E; color: #fff; border: 2.5px solid #1B1A2E; box-shadow: 4px 4px 0 #FFB020;
    }
    .summary h2 { font-family: 'Baloo 2', cursive; font-size: 1rem; font-weight: 800; margin-bottom: 8px; color: #fff; }
    .summary-rows { display: flex; flex-direction: column; gap: 5px; }
    .summary-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; background: #F7F5FF; border-radius: 10px; font-size: 0.8rem;
    }
    .summary-row .name { font-weight: 600; color: #1B1A2E; }
    .summary-row .amount { font-family: 'Baloo 2', cursive; font-weight: 800; color: #1B1A2E; }
    .summary-row-rico { background: #FFD9A0; }
    .summary-shared-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 5px 10px; background: #EAF6FF; border-radius: 10px;
      font-size: 0.75rem; color: #12609E; font-weight: 600;
    }
    .summary-total-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; margin-top: 3px;
    }
    .summary-total-row.ok      { background: #B2F2BB; color: #1B1A2E; }
    .summary-total-row.warning { background: #FFF3BF; color: #1B1A2E; }
    .summary-total-row.error   { background: #FFE3E3; color: #1B1A2E; }
    .badge { font-size: 0.68rem; padding: 2px 9px; border-radius: 999px; font-weight: 700; border: 1.5px solid #1B1A2E; }
    .badge-ok    { background: #12B886; color: #fff; }
    .badge-warn  { background: #FFB020; color: #1B1A2E; }
    .badge-error { background: #FF5D5D; color: #fff; }

    /* ── Shared portion inside persona card ── */
    .shared-portion {
      padding: 5px 10px 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border-top: 2px dashed #BEE3F8;
      background: #EAF6FF;
    }
    .shared-portion-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #12609E;
      font-weight: 600;
      padding: 2px 0;
    }
    .shared-portion-name { font-weight: 500; }
    .shared-portion-amt  { font-weight: 800; white-space: nowrap; }

    /* ── Modal compartir ── */
    .modal-overlay {
      display: flex; position: fixed; inset: 0;
      background: rgba(27,26,46,0.6); z-index: 100;
      align-items: flex-end; justify-content: center; padding: 0;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity .25s ease-out, visibility 0s linear .25s;
    }
    .modal-overlay.show {
      opacity: 1; visibility: visible; pointer-events: auto;
      transition: opacity .25s ease-out;
    }
    .modal {
      background: #fff; border: 2.5px solid #1B1A2E; border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
      box-shadow: 0 -6px 0 #1B1A2E;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-handle {
      width: 40px; height: 5px; background: #E4E0F0; border-radius: 999px;
      margin: 6px auto 10px;
    }

    @media (min-width: 700px) {
      .modal-overlay { align-items: center; padding: 16px; }
      .modal {
        border-bottom: 2.5px solid #1B1A2E; border-radius: 16px;
        padding: 16px; max-height: 90vh; box-shadow: 5px 5px 0 #1B1A2E;
        transform: none;
      }
      .modal-handle { display: none; }
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .modal-header h3 { font-family: 'Baloo 2', cursive; font-size: 0.95rem; font-weight: 800; color: #1B1A2E; }
    .modal-close {
      background: none; border: none; cursor: pointer; color: #6B6684; font-size: 1rem;
    }
    .modal textarea {
      width: 100%; height: 260px; resize: none;
      border: 2px solid #1B1A2E; border-radius: 10px;
      padding: 10px; font-size: 0.82rem; line-height: 1.6;
      color: #1B1A2E; font-family: inherit; outline: none;
      background: #FAFAFE;
    }
    .btn-copy {
      margin-top: 10px; width: 100%; padding: 9px;
      background: #6C5CE7; color: #fff; border: 2.5px solid #1B1A2E; border-radius: 10px;

<script>
// ─────────────────────────────────────────────────────
//  ESTADO
// ─────────────────────────────────────────────────────
const LS_KEY = 'dcv4'; // versión 4 — % por persona, no por ítem

let S = {
  total:          '',
  pct:            '',   // propina global (%) para todos los ítems
  currency:       '',   // CLP, USD, ARS, EUR — se autodetecta si viene vacío
  personaCount:   0,
  shared:         [],   // [{id, name, price}]
  personas:       [],   // [{id, name, items:[{id, name, price}]}]
  created:        false // se activa recién al tocar "Crear cuenta"
};

// ─────────────────────────────────────────────────────
//  PERSISTENCIA
// ─────────────────────────────────────────────────────
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
  if (MODE !== 'solo') schedulePush();
}

function loadFromLocalStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.personas)) {
        S = parsed;
        // compatibilidad con cuentas guardadas antes de que existiera este gate
        if (typeof S.created !== 'boolean') S.created = S.personas.length > 0;
      }
    }
  } catch (e) {}
}

async function load() {
  loadFromLocalStorage();

  if (location.hash.startsWith('#live=')) {
    const joined = await bootstrapGuestFromHash();
    if (joined) return;
    // si falló (sesión inexistente/expirada), ya se avisó y seguimos con lo local
    return;
  }

  // ¿veníamos de una sesión en vivo (recarga de página, sin hash)?
  const existing = loadSessionFromStorage();
  if (existing) {
    const { ok, status, data } = await apiCall(existing.sessionId).catch(() => ({ ok: false }));
    if (ok && !data.closed) {
      liveSession = existing;
      MODE = existing.role;
      S = {
        total: data.total || '', pct: data.pct || '', currency: data.currency || '',
        personaCount: 0, created: true,
        shared: (data.shared || []).map(i => ({ id: i.id, name: i.name || '', price: i.price || '' })),
        personas: (data.personas || []).map(p => ({ id: p.id, name: p.name || '', emoji: p.emoji || '', items: (p.items || []).map(i => ({ id: i.id, name: i.name || '', price: i.price || '' })), paid: !!p.paid }))
      };
      lastSeenVersion = data.version || 0;
      startPolling();
    } else {
      // la sesión ya no existe/está cerrada — se cae a la cuenta local normal
      clearSession();
    }
  }
}

async function exportarArchivo() {
  const total    = parseAmount(document.getElementById('totalBill').value) || 0;
  const n        = S.personas.length;
  const sharedAmt = sharedTotalConPct();
  const sharedPP  = n > 0 ? sharedAmt / n : 0;
  const results   = computeResults(total, sharedPP);
  const sum       = results.reduce((s,r) => s + r.amount, 0);
  const ok        = total > 0 && Math.abs(sum - total) < 1;

  const gPct = parseFloat(S.pct) || 0;

  let txt = T.export.header + '\n';
  txt += '─────────────────────\n';

  if (total > 0) {
    if (gPct > 0) {
      const baseTotal = total / (1 + gPct / 100);
      const propinaMonto = total - baseTotal;
      txt += T.export.subtotal(fmt(baseTotal)) + '\n';
      txt += T.export.tip(gPct, fmt(propinaMonto)) + '\n';
      txt += T.export.total(fmt(total)) + '\n';
    } else {
      txt += T.export.totalNoTip(fmt(total)) + '\n';
    }
  }

  const payer = S.personas.find(p => p.paid);
  if (payer) {
    txt += T.export.paidBy(payer.name || T.persona.removeConfirmFallbackName) + '\n';
  }

  // Compartidos
  const sharedConValor = S.shared.filter(i => parseAmount(i.price) > 0);
  if (sharedConValor.length > 0 && n > 0) {
    txt += '\n' + T.export.sharedHeader(n) + '\n';
    sharedConValor.forEach(i => {
      const pr  = parseAmount(i.price) || 0;
      const tot = pr * (1 + gPct / 100);
      const label = i.name || T.export.sharedItemDefault;
      txt += T.export.sharedItemLine(label, fmt(tot), fmt(tot/n)) + '\n';
    });
  }

  // Por persona
  txt += '\n' + T.export.perPersonHeader + '\n';
  results.forEach((r, idx) => {
    const p = S.personas[idx];
    const isRico = results.every((x,i) => i === idx || x.amount <= r.amount) && results.some(x => Math.abs(x.amount - r.amount) > 1);
    txt += '\n' + T.export.personLine(r.name, isRico, fmt(r.amount)) + '\n';
    let basePersona = 0;
    if (p && p.items.length > 0) {
      p.items.forEach(item => {
        const pr = parseAmount(item.price) || 0;
        if (pr > 0) {
          basePersona += pr;
          const label = item.name || T.export.itemDefault;
          txt += T.export.itemLine(label, fmt(pr)) + '\n';
        }
      });
    }
    if (sharedPP > 0) {
      const baseSharedPP = sharedPP / (1 + gPct / 100);
      basePersona += baseSharedPP;
      txt += T.export.sharedPersonLine(fmt(baseSharedPP)) + '\n';
    }
    if (gPct > 0 && basePersona > 0) {
      const propinaPers = r.amount - basePersona;
      txt += T.export.tipPersonLine(gPct, fmt(propinaPers)) + '\n';
    }
  });

  txt += '\n─────────────────────\n';
  txt += ok ? T.export.matches : T.export.sum(fmt(sum));

  document.getElementById('modalText').value = txt;
  document.getElementById('btnCopy').textContent = T.modal.copy;
  document.getElementById('btnCopy').classList.remove('copied');
  document.getElementById('modalDetailToggle').open = ok; // se abre solo cuando ya está completa
  document.getElementById('modalOverlay').classList.add('show');

  renderLiveModalSection(ok);
}

function renderLiveModalSection(ok) {
  const setupEl = document.getElementById('modalLiveSetup');
  const activeEl = document.getElementById('modalLiveActive');
  const doneEl = document.getElementById('modalRelayDone');
  const balancedNoteEl = document.getElementById('modalLiveBalancedNote');

  if (MODE === 'host' && liveSession) {
    setupEl.style.display = 'none';
    activeEl.style.display = 'block';
    doneEl.style.display = 'none';
    updateLiveModalLink();
    updateLiveModalParticipants();
    if (balancedNoteEl) {
      balancedNoteEl.style.display = ok ? 'block' : 'none';
      balancedNoteEl.textContent = T.live.balancedNote;
    }
  } else if (MODE === 'guest') {
    // los invitados no ven "poner en vivo" ni "cerrar sesión" — solo el host
    setupEl.style.display = 'none';
    activeEl.style.display = 'none';
    doneEl.style.display = ok ? 'block' : 'none';
  } else {
    setupEl.style.display = 'block';

let _dialogResolve = null;

function showDialog({ title, message, okText, cancelText, showCancel }) {
  return new Promise(resolve => {
    _dialogResolve = resolve;
    document.getElementById('customDialogTitle').textContent = title;
    document.getElementById('customDialogMessage').textContent = message;
    const cancelBtn = document.getElementById('customDialogCancel');
    cancelBtn.textContent = cancelText || T.dialog.cancel;
    cancelBtn.style.display = showCancel ? 'inline-flex' : 'none';
    document.getElementById('customDialogOk').textContent = okText || T.dialog.ok;
    document.getElementById('customDialogOverlay').classList.add('show');
  });
}

function resolveDialog(result) {
  document.getElementById('customDialogOverlay').classList.remove('show');
  if (_dialogResolve) { _dialogResolve(result); _dialogResolve = null; }
}

function customConfirm(message, opts = {}) {
  return showDialog({ title: T.dialog.confirmTitle, message, showCancel: true, ...opts });
}

function customAlert(message, opts = {}) {
  return showDialog({ title: T.dialog.infoTitle, message, showCancel: false, ...opts });
}

function copiarDetalle() {

}

let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function initInstallBanner() {
  if (isStandalone() || localStorage.getItem('installBannerDismissed')) return;

  const ua = navigator.userAgent.toLowerCase();
  const isIOS = /iphone|ipad|ipod/.test(ua);
  const isAndroid = /android/.test(ua);
  if (!isIOS && !isAndroid) return; // solo tiene sentido en el celular

  const banner = document.getElementById('installBanner');
  const msgEl = document.getElementById('installBannerMsg');
  const actionBtn = document.getElementById('installBannerAction');
  if (!banner || !msgEl || !actionBtn) return;

  if (isIOS) {
    setTimeout(() => {
      if (isStandalone() || localStorage.getItem('installBannerDismissed')) return;
      msgEl.textContent = T.install.iosMessage;
      actionBtn.style.display = 'none';
      banner.classList.add('show');
    }, 2000);
  } else if (isAndroid) {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredInstallPrompt = e;
      if (localStorage.getItem('installBannerDismissed')) return;
      msgEl.textContent = T.install.androidMessage;
      actionBtn.textContent = T.install.androidButton;
      actionBtn.style.display = 'inline-flex';
      banner.classList.add('show');
    });
  }
}

function installBannerAction() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    dismissInstallBanner();
  });
}

function dismissInstallBanner() {
  const banner = document.getElementById('installBanner');
  if (banner) banner.classList.remove('show');
  localStorage.setItem('installBannerDismissed', '1');
}

function sharedTotalConPct() {
  const base = S.shared.reduce((s, i) => s + (parseAmount(i.price) || 0), 0);
  const pct  = parseFloat(S.pct) || 0;
  return base * (1 + pct / 100);
}
function personaConPct(p) {
  const base = p.items.reduce((s, i) => s + (parseAmount(i.price) || 0), 0);
  const pct  = parseFloat(S.pct) || 0;
  return base * (1 + pct / 100);
}
// ─────────────────────────────────────────────────────
//  MONEDA
// ─────────────────────────────────────────────────────
const CURRENCIES = {
  CLP: { locale: 'es-CL', currency: 'CLP', decimals: 0 },
  USD: { locale: 'en-US', currency: 'USD', decimals: 2 },
  ARS: { locale: 'es-AR', currency: 'ARS', decimals: 0 },
  EUR: { locale: 'de-DE', currency: 'EUR', decimals: 2 }
};

function detectCurrency() {
  const lang = (navigator.language || 'es-CL').toLowerCase();
  if (lang.startsWith('es-ar')) return 'ARS';
  if (lang.startsWith('en'))    return 'USD';
  if (lang.startsWith('de') || lang.startsWith('fr') || lang.startsWith('it')) return 'EUR';
  return 'CLP';
}

function hasAnyAmount() {
  if (S.total && String(S.total).trim()) return true;
  if (S.shared.some(i => i.price && String(i.price).trim())) return true;
  if (S.personas.some(p => p.items.some(i => i.price && String(i.price).trim()))) return true;
  return false;
}

async function setCurrency(cur) {
  if (!CURRENCIES[cur]) return;
  if (S.currency === cur) return;

  // No hacemos conversión "de mentira" (relabelear el mismo número como si
  // fuera otra moneda sería engañoso: 20.000 CLP y 20.000 USD son montos
  // muy distintos) ni conversión real (requeriría un tipo de cambio en vivo,
  // que agrega dependencia externa y no siempre refleja lo que de verdad se
  // pagó). Si ya hay montos escritos, avisamos y limpiamos para no arrastrar
  // un número que ya no significa lo mismo.
  if (hasAnyAmount() && !await customConfirm(T.topbar.confirmCurrencyChange)) {
    updateCurrencySelect(); // revierte el <select> a la moneda actual
    return;
  }

  S.currency = cur;
  S.total = '';
  S.shared.forEach(item => { item.price = ''; });
  S.personas.forEach(p => { p.items.forEach(item => { item.price = ''; }); });

  save();
  updateCurrencySelect();
  const totalInput = document.getElementById('totalBill');
  if (totalInput) totalInput.value = '';
  renderAll();
}

function updateCurrencySelect() {
  const sel = document.getElementById('currencySelect');
  if (sel) sel.value = S.currency || 'CLP';
}

function fmt(n) {
  const cfg = CURRENCIES[S.currency] || CURRENCIES.CLP;
  try {
    return new Intl.NumberFormat(cfg.locale, {
      style: 'currency', currency: cfg.currency,
      minimumFractionDigits: cfg.decimals, maximumFractionDigits: cfg.decimals
    }).format(n || 0);
  } catch (e) {
    return '$' + Math.round(n || 0).toLocaleString('es-CL');
  }
}

// ── Inputs de montos formateados según la moneda ──
function currencySeparators(locale) {
  const parts = new Intl.NumberFormat(locale).formatToParts(1234.5);
  return {
    group:   (parts.find(p => p.type === 'group')   || {}).value || ',',
    decimal: (parts.find(p => p.type === 'decimal') || {}).value || '.'
  };
}

function parseAmount(str) {
  if (str == null) return 0;
  let s = String(str).trim();
  if (!s) return 0;
  const cfg = CURRENCIES[S.currency] || CURRENCIES.CLP;
  const { group, decimal } = currencySeparators(cfg.locale);
  s = s.split(group).join('');
  if (decimal !== '.') s = s.split(decimal).join('.');
  s = s.replace(/[^\d.\-]/g, '');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}

function formatAmountInput(n) {
  const num = typeof n === 'number' ? n : parseAmount(n);
  if (!num && num !== 0) return '';
  const cfg = CURRENCIES[S.currency] || CURRENCIES.CLP;
  try {
    return new Intl.NumberFormat(cfg.locale, {
      minimumFractionDigits: cfg.decimals, maximumFractionDigits: cfg.decimals
    }).format(num);
  } catch (e) {
    return String(num);
  }
}

function reformatAmountField(el) {
  if (!el || !el.value.trim()) return;
  el.value = formatAmountInput(parseAmount(el.value));
}

// ─────────────────────────────────────────────────────
//  LOCK
// ─────────────────────────────────────────────────────
let manualUnlocked = false;
let lastOk = false;

function applyLock(ok) {
  const card   = document.querySelector('.main-card');
  const banner = document.getElementById('lockBanner');
  if (ok && !manualUnlocked) {
    card.classList.add('locked');
    banner.style.display = 'flex';
  } else {
    card.classList.remove('locked');
    banner.style.display = 'none';
  }
}

function unlock() {
  manualUnlocked = true;
  applyLock(false);
}

function recalc() {
  const total      = parseAmount(document.getElementById('totalBill').value) || 0;
  const n          = S.personas.length;
  const sharedAmt  = sharedTotalConPct();
  const sharedPP   = n > 0 ? sharedAmt / n : 0;

  // badge compartidos
  document.getElementById('sharedBadge').textContent =
    n > 0 && sharedAmt > 0
      ? `${fmt(sharedAmt)} ÷ ${n} = ${fmt(sharedPP)} ${T.shared.perUnit}`
      : fmt(sharedAmt) + ' ' + T.shared.badgeAll;

  // resultados por persona
  const results = computeResults(total, sharedPP);

  // actualizar totales en cards
  S.personas.forEach(p => {
    const el = document.getElementById('pt-' + p.id);
    if (el) {
      const r = results.find(r => r.id === p.id);
      el.textContent = r ? fmt(r.amount) : fmt(0);
    }
  });

  const ok = total > 0 && Math.abs(results.reduce((s,r)=>s+r.amount,0) - total) < 1;
  lastOk = ok;
  if (!ok) manualUnlocked = false; // si deja de cuadrar, resetear unlock manual
  applyLock(ok);

  renderSummary(results, total, sharedPP, sharedAmt);
}

function computeResults(total, sharedPP) {
  if (S.personas.length === 0) return [];
  // cada uno paga lo suyo + su % + su parte de lo compartido
  return S.personas.map((p,i) => ({
    id: p.id, name: p.name || T.persona.defaultNames[i % T.persona.defaultNames.length],
    amount: personaConPct(p) + sharedPP
  }));
}

function renderSummary(results, total, sharedPP, sharedAmt) {
  const c = document.getElementById('summaryRows');
  c.innerHTML = '';

  if (results.length === 0) {
    c.innerHTML = `<p style="color:#a0aec0;font-size:.8rem;text-align:center;padding:8px 0;">${T.summary.empty}</p>`;
    return;
  }

  // línea compartido si aplica
  if (sharedAmt > 0 && S.personas.length > 0) {
    const row = el('div', 'summary-shared-row');
    row.innerHTML = `<span>${T.summary.sharedLine(S.personas.length)}</span><span style="font-weight:700">${fmt(sharedPP)} ${T.summary.perUnit}</span>`;
    c.appendChild(row);
  }

  const sum      = results.reduce((s,r) => s + r.amount, 0);
  const maxAmt   = Math.max(...results.map(r => r.amount));
  const richIdx  = results.findIndex(r => r.amount === maxAmt);
  const hayDif   = results.some(r => Math.abs(r.amount - maxAmt) > 1);

  results.forEach((r, i) => {
    const isRico = i === richIdx && hayDif && results.length > 1;
    const row = el('div', 'summary-row' + (isRico ? ' summary-row-rico' : ''));
    row.innerHTML = `
      <span class="name">${esc(r.name)}${isRico ? ' 😂' : ''}</span>
      <span class="amount">${fmt(r.amount)}</span>
    `;
    c.appendChild(row);
  });

  // ── Desglose propina ──
  const gPct = parseFloat(S.pct) || 0;
  if (gPct > 0) {
    const baseSinPropina = results.reduce((s, r) => {
      const p = S.personas.find(px => px.id === r.id);
      const baseP = p ? p.items.reduce((a,i) => a + (parseAmount(i.price)||0), 0) : 0;
      return s + baseP;
    }, 0) + (S.shared.reduce((s,i) => s+(parseAmount(i.price)||0), 0) / (S.personas.length||1)) * S.personas.length;
    const propinaMonto = sum - baseSinPropina;

    const rb = el('div', 'summary-row');
    rb.style.cssText = 'background:#f7fafc;font-size:.78rem;';
    rb.innerHTML = `<span class="name" style="color:#718096">${T.summary.subtotalNoTip}</span><span class="amount" style="color:#718096">${fmt(baseSinPropina)}</span>`;
    c.appendChild(rb);

    const rp = el('div', 'summary-row');
    rp.style.cssText = 'background:#fef9ec;font-size:.78rem;';
    rp.innerHTML = `<span class="name" style="color:#92400e">${T.summary.tipLine(gPct)}</span><span class="amount" style="color:#92400e">+${fmt(propinaMonto)}</span>`;
    c.appendChild(rp);
  }

  const diff    = total > 0 ? Math.abs(sum - total) : null;
  const ok      = diff !== null && diff < 1;
  const noTotal = total === 0;
  const cls     = noTotal ? 'warning' : (ok ? 'ok' : 'error');
  const msg     = noTotal ? T.summary.noTotal : (ok ? T.summary.ok : (sum > total ? T.summary.over : T.summary.under));
  const bCls    = noTotal ? 'badge-warn' : (ok ? 'badge-ok' : 'badge-error');

  const tr = el('div', `summary-total-row ${cls}`);
  tr.innerHTML = `<span>${gPct > 0 ? T.summary.totalWithTip : T.summary.totalNoTip}: ${fmt(sum)}</span><span class="badge ${bCls}">${msg}</span>`;
  c.appendChild(tr);

  if (!noTotal && !ok) {
    const dr = el('div');
    dr.style.cssText = 'font-size:.75rem;color:#718096;text-align:right;padding:3px 9px 0;';
    dr.textContent = sum > total
      ? T.summary.exceededBy(fmt(sum - total))
      : T.summary.missingBy(fmt(total - sum));
    c.appendChild(dr);
  }
}

// ─────────────────────────────────────────────────────
//  UTILIDADES
// ─────────────────────────────────────────────────────
function uid() { return Date.now() + Math.random(); }
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

// ─────────────────────────────────────────────────────
//  CUENTA COMPARTIDA "EN VIVO" (reemplaza el link "en posta")
// ─────────────────────────────────────────────────────
const SESSION_LS_KEY = 'dcv4_session';

let MODE = 'solo'; // 'solo' | 'host' | 'guest'
let liveSession = null; // { sessionId, role, myPersonaIds:[] }
let pollTimer = null;
let pollFailCount = 0;
let lastSeenVersion = 0;
let lastPushedVersion = 0;
let pushTimer = null;

function saveSession() {
  try { localStorage.setItem(SESSION_LS_KEY, JSON.stringify(liveSession)); } catch (e) {}
}

function loadSessionFromStorage() {
  try {
    const raw = localStorage.getItem(SESSION_LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.sessionId) return parsed;
    }
  } catch (e) {}
  return null;
}

function clearSession() {
  liveSession = null;
  MODE = 'solo';
  try { localStorage.removeItem(SESSION_LS_KEY); } catch (e) {}
  stopPolling();
  updateLiveIndicator();
}

async function apiCall(path, opts) {
  const res = await fetch('/api/session/' + path, opts);
  return { ok: res.ok, status: res.status, data: await res.json().catch(() => ({})) };
}

// ── Crear sesión (host) ──
async function goLive() {
  const btn = document.getElementById('btnGoLive');
  const originalText = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.classList.add('loading'); btn.textContent = T.live.goLiveLoading; }
  try {
    const { ok, data } = await apiCall('create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        total: S.total, pct: S.pct, currency: S.currency,
        shared: S.shared.map(i => ({ name: i.name, price: i.price }))
      })
    });
    if (!ok) throw new Error('create_failed');

    liveSession = { sessionId: data.sessionId, role: 'host', myPersonaIds: S.personas.map(p => p.id) };
    saveSession();
    MODE = 'host';
    history.replaceState(null, '', location.pathname + location.search + '#live=' + data.sessionId);
    startPolling();
    updateLiveIndicator();
    renderLiveModalSection(lastOk);
  } catch (e) {
    await customAlert(T.live.goLiveFailed);
  } finally {
    if (btn) { btn.disabled = false; btn.classList.remove('loading'); btn.textContent = originalText; }
  }
}

function updateLiveModalLink() {
  if (!liveSession) return;
  const joinUrl = location.origin + location.pathname + '#live=' + liveSession.sessionId;
  const qr = document.getElementById('modalLiveQr');
  if (qr) {
    qr.parentElement.style.display = ''; // por si un intento anterior lo había ocultado (onerror)
    qr.alt = T.live.qrAlt;
    // mismos colores del marco (.qr-frame) que usa el QR de Share.html, para que se vea parejo
    qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=1B1A2E&bgcolor=FFFDF7&data=${encodeURIComponent(joinUrl)}`;
  }
  const linkInput = document.getElementById('modalLiveLink');
  if (linkInput) linkInput.value = joinUrl;
}

function updateLiveModalParticipants() {
  const el = document.getElementById('modalLiveParticipants');
  if (el) el.textContent = T.live.participants(S.personas.length);
}

function copiarLiveLink() {
  const url = document.getElementById('modalLiveLink').value;
  if (!url) return;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btnCopyLiveLink');
    btn.textContent = T.live.copiedLink;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = T.live.copyLink; btn.classList.remove('copied'); }, 2000);
  });
  bumpUsageCounter();
}

async function confirmCloseLive() {
  if (!liveSession) return;
  if (!await customConfirm(T.live.confirmCloseSession)) return;
  try { await apiCall(liveSession.sessionId + '/close', { method: 'POST' }); } catch (e) {}
  clearSession();
  closeModal();
  showToast(T.live.sessionClosed);
}

async function confirmLeaveLive() {
  if (!await customConfirm(T.live.confirmLeaveSession)) return;
  clearSession();
  history.replaceState(null, '', location.pathname + location.search);
  loadFromLocalStorage();
  if (S.personas.length === 0) await addPersona();
  else renderAll();
}

function handleLiveIndicatorAction() {
  if (MODE === 'host') return confirmCloseLive();
  if (MODE === 'guest') return confirmLeaveLive();
}

function updateLiveIndicator() {
  const bar = document.getElementById('liveIndicator');
  const textEl = document.getElementById('liveIndicatorText');
  const btn = document.getElementById('btnLeaveLive');
  if (!bar || !textEl || !btn) return;
  if (MODE === 'host') {
    bar.style.display = 'flex';
    textEl.textContent = T.live.hostBanner;
    btn.textContent = T.live.closeSessionButton;
  } else if (MODE === 'guest') {
    bar.style.display = 'flex';
    const host = S.personas.find(p => !liveSession.myPersonaIds.includes(p.id));
    textEl.textContent = T.live.bannerLive(host ? host.name : '');
    btn.textContent = T.live.leaveSession;
  } else {
    bar.style.display = 'none';
  }

  const card = document.querySelector('.main-card');
  if (card) {
    card.classList.toggle('guest-mode', MODE === 'guest');
    card.classList.toggle('live-mode', MODE !== 'solo');
    if (MODE !== 'solo') card.classList.remove('not-created'); // en vivo ya está "creada" por definición
  }
  const crearCuentaBtn = document.getElementById('btnCrearCuenta');
  if (crearCuentaBtn && MODE !== 'solo') crearCuentaBtn.style.display = 'none';

  const addBtn = document.querySelector('.btn-add-persona');
  if (addBtn) {
    addBtn.textContent = (MODE === 'guest' || MODE === 'host') ? T.live.joinButton : T.persona.addPersona;
  }
}

// ── Sumarse a una sesión (invitado) ──
async function addPersonaGuest() {
  if (!liveSession) return;
  const unnamed = S.personas.find(p => liveSession.myPersonaIds.includes(p.id) && (!p.name || !p.name.trim()));
  if (unnamed) {
    await customAlert(T.persona.needNameBeforeAdding);
    focusPersonaNameInput(unnamed.id);
    return;
  }

  const placeholderId = 'pending-' + Date.now();
  const list = document.getElementById('personasList');
  const card = el('div', 'persona-card pending');
  card.id = placeholderId;
  card.innerHTML = `<div class="persona-header"><span>⏳ ${esc(T.live.joining)}</span></div>`;
  list.appendChild(card);

  try {
    const { ok, data } = await apiCall(liveSession.sessionId + '/persona', { method: 'POST' });
    if (!ok) throw new Error('join_failed');
    liveSession.myPersonaIds.push(data.personaId);
    saveSession();
    S.personas.push({ id: data.personaId, name: '', emoji: data.emoji, items: [], paid: false });
    localStorage.setItem(LS_KEY, JSON.stringify(S));
    renderPersonas();
    addItem(data.personaId);
    focusPersonaNameInput(data.personaId);
  } catch (e) {
    const ph = document.getElementById(placeholderId);
    if (ph) ph.remove();
    await customAlert(T.live.joinFailed);
  }
}

function handleAddPersonaClick() {
  if (MODE === 'guest' || MODE === 'host') return addPersonaGuest();
  return addPersona();
}

// ── Polling (sincronización cada ~4s) ──
function startPolling() {
  if (pollTimer) return;
  pollTimer = setInterval(pollTick, 4000);
  document.addEventListener('visibilitychange', handleVisibilityChange);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  document.removeEventListener('visibilitychange', handleVisibilityChange);
}

function handleVisibilityChange() {
  if (document.hidden) stopPolling();
  else if (liveSession) startPolling();
}

function isAnyModalOpen() {
  return document.getElementById('modalOverlay').classList.contains('show') ||
         document.getElementById('customDialogOverlay').classList.contains('show') ||
         document.getElementById('infoModalOverlay').classList.contains('show');
}

async function pollTick() {
  if (!liveSession || isAnyModalOpen()) return;
  try {
    const { ok, status, data } = await apiCall(liveSession.sessionId);
    if (!ok) {
      if (status === 404) {
        await customAlert(T.live.sessionExpired);
        clearSession();
        history.replaceState(null, '', location.pathname + location.search);
        loadFromLocalStorage();
        if (S.personas.length === 0) await addPersona();
        else renderAll();
        return;
      }
      throw new Error('poll_failed');
    }
    pollFailCount = 0;
    hideConnectionBanner();
    if (data.closed && MODE === 'guest') {
      await customAlert(T.live.sessionClosed);
      clearSession();
      history.replaceState(null, '', location.pathname + location.search);
      loadFromLocalStorage();
      if (S.personas.length === 0) await addPersona();
      else renderAll();
      return;
    }
    if (data.version === lastSeenVersion || data.version <= lastPushedVersion) return;
    lastSeenVersion = data.version;
    mergeRemote(data);
  } catch (e) {
    pollFailCount++;
    if (pollFailCount >= 3) showConnectionBanner();
  }
}

function showConnectionBanner() {
  const b = document.getElementById('connectionBanner');
  if (b) { b.querySelector('span').textContent = T.live.offlineBanner; b.classList.add('show'); }
}
function hideConnectionBanner() {
  const b = document.getElementById('connectionBanner');
  if (b) b.classList.remove('show');
}

const LIVE_INPUT_IDS_PREFIX = ['totalBill', 'pname-', 'iname-', 'iprice-', 'sname-', 'sprice-'];

function mergeRemote(remote) {
  const active = document.activeElement;
  let preserved = null;
  if (active && active.id) {
    preserved = { id: active.id, value: active.value, selStart: active.selectionStart, selEnd: active.selectionEnd };
  }

  S.total = remote.total || '';
  S.pct = remote.pct || '';
  S.currency = remote.currency || '';
  S.created = true;
  S.shared = (remote.shared || []).map(i => ({ id: i.id, name: i.name || '', price: i.price || '' }));
  S.personas = (remote.personas || []).map(p => ({
    id: p.id, name: p.name || '', emoji: p.emoji || '', items: (p.items || []).map(i => ({ id: i.id, name: i.name || '', price: i.price || '' })), paid: !!p.paid
  }));
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}

  updateTipSelect();
  updateCurrencySelect();
  const totalInput = document.getElementById('totalBill');
  if (totalInput) totalInput.value = formatAmountInput(S.total);
  renderAll();
  updateLiveIndicator();

  if (preserved) {
    const elActive = document.getElementById(preserved.id);
    if (elActive && typeof elActive.focus === 'function') {
      elActive.value = preserved.value;
      elActive.focus();
      if (typeof elActive.setSelectionRange === 'function') {
        try { elActive.setSelectionRange(preserved.selStart, preserved.selEnd); } catch (e) {}
      }
    }
  }
}

// ── Push de cambios locales (debounced, host/guest) ──
function schedulePush() {
  if (MODE === 'solo' || !liveSession) return;
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(doPush, 400);
}

async function doPush() {
  if (!liveSession) return;
  try {
    if (MODE === 'host') {
      await apiCall(liveSession.sessionId + '/meta', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ total: S.total, pct: S.pct, currency: S.currency })
      });
      for (const item of S.shared) {
        await apiCall(liveSession.sessionId + '/shared-item/' + item.id, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: item.name, price: item.price })
        });
      }
    }
    for (const pid of liveSession.myPersonaIds) {
      const p = S.personas.find(p => p.id === pid);
      if (!p) continue;
      const { data } = await apiCall(liveSession.sessionId + '/persona/' + pid, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: p.name, emoji: p.emoji, items: p.items, paid: p.paid })
      });
    }
    const { ok, data } = await apiCall(liveSession.sessionId);
    if (ok && typeof data.version === 'number') lastPushedVersion = data.version;
  } catch (e) { /* el próximo poll ya se encarga de reintentar la lectura */ }
}

// ── Bootstrap de invitado (abrir un link #live=<id>) ──
async function bootstrapGuestFromHash() {
  if (!location.hash.startsWith('#live=')) return false;
  const sessionId = location.hash.slice(6);

  // Entrar por QR/link es una acción explícita — reemplaza cualquier cosa que
  // hubiera localmente sin preguntar (evita además quedar esperando un diálogo
  // de confirmación mientras el loader de la página sigue tapando la pantalla).
  const existing = loadSessionFromStorage();
  if (existing && existing.sessionId === sessionId) {
    liveSession = existing;
    MODE = existing.role;
  } else {
    liveSession = { sessionId, role: 'guest', myPersonaIds: [] };
  }

  const { ok, status, data } = await apiCall(sessionId);
  if (!ok) {
    await customAlert(status === 404 ? T.live.sessionExpired : T.live.joinFailed);
    liveSession = null;
    history.replaceState(null, '', location.pathname + location.search);
    return false;
  }

  MODE = liveSession.role;
  saveSession();
  S = {
    total: data.total || '', pct: data.pct || '', currency: data.currency || '',
    personaCount: 0, created: true,
    shared: (data.shared || []).map(i => ({ id: i.id, name: i.name || '', price: i.price || '' })),
    personas: (data.personas || []).map(p => ({ id: p.id, name: p.name || '', emoji: p.emoji || '', items: (p.items || []).map(i => ({ id: i.id, name: i.name || '', price: i.price || '' })), paid: !!p.paid }))
  };
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  lastSeenVersion = data.version || 0;
  history.replaceState(null, '', location.pathname + location.search);
  startPolling();
  updateLiveIndicator();
  return true;
}

})();
