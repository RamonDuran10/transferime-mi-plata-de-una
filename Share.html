<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compartir — ¿Quién debe qué?</title>
  <script src="es.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #FFF3E0;
      background-image: radial-gradient(#FFD9A0 2px, transparent 2px);
      background-size: 26px 26px;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 48px 12px;
      color: #1B1A2E;
    }

    .card-wrap { position: relative; width: 100%; max-width: 380px; }

    .ribbon {
      position: absolute; top: -16px; left: -14px; z-index: 2;
      background: #FFB020; border: 2.5px solid #1B1A2E; border-radius: 10px;
      padding: 6px 14px; transform: rotate(-8deg);
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 0.78rem;
      box-shadow: 3px 3px 0 #1B1A2E;
      white-space: nowrap;
    }

    .card {
      background: #fff;
      border: 2.5px solid #1B1A2E;
      border-radius: 20px;
      padding: 28px 24px 24px;
      box-shadow: 6px 6px 0 #1B1A2E;
      text-align: center;
    }

    h1 {
      font-family: 'Baloo 2', cursive; font-weight: 800; font-size: 1.4rem;
      margin-bottom: 4px; letter-spacing: -.3px;
    }
    p.subtitle { font-size: .82rem; color: #6B6684; margin-bottom: 18px; }

    .qr-frame {
      border: 2.5px solid #1B1A2E; border-radius: 16px;
      padding: 10px; background: #FFFDF7;
      box-shadow: 3px 3px 0 #1B1A2E;
      display: inline-block; margin-bottom: 16px;
    }
    .qr-frame img { display: block; width: 230px; height: 230px; }

    .url-box {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .82rem;
      background: #F3F0FF; border: 2px solid #1B1A2E; border-radius: 999px;
      padding: 6px 6px 6px 16px; margin-bottom: 16px;
      color: #4a3ec9;
    }
    .url-box span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-copy-link {
      flex: 0 0 auto;
      font-family: 'Baloo 2', cursive; font-weight: 700; font-size: .78rem;
      background: #1B1A2E; color: #fff; border: none; border-radius: 999px;
      padding: 7px 14px; cursor: pointer; transition: background .15s;
    }
    .btn-copy-link:hover { background: #34324f; }
    .btn-copy-link.copied { background: #12B886; }

    .pills { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
    .pill {
      font-size: .72rem; font-weight: 700; padding: 5px 12px; border-radius: 999px;
      border: 1.5px solid #1B1A2E;
    }
    .pill.green  { background: #B2F2BB; color: #1B1A2E; }
    .pill.blue   { background: #BEE3F8; color: #1B1A2E; }
    .pill.orange { background: #FFD9A0; color: #1B1A2E; }

    .divider {
      border: none; border-top: 2px dashed #E4E0F0; margin: 0 0 14px;
    }

    a.back {
      display: inline-block; font-size: .78rem; font-weight: 600;
      color: #6B6684; text-decoration: none;
    }
    a.back:hover { color: #6C5CE7; }

    p.tagline {
      margin-top: 22px; text-align: center; font-size: .82rem; color: #8b86a3;
      max-width: 320px;
    }
  </style>
</head>

  document.getElementById('pillNoAccount').textContent = T.share.pillNoAccount;
  document.getElementById('pillFast').textContent = T.share.pillFast;
  const backLink = document.getElementById('backLink');
  backLink.textContent = T.share.back;
  backLink.title = T.share.backTitle;
  document.getElementById('shareTagline').textContent = T.share.tagline;
}

function copiarLink() {
  const url = 'https://' + T.share.url + '/';
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('btnCopyLink');
    const original = T.share.copy;
    btn.textContent = T.share.copied;
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 2000);
  });
}

applyShareStrings();
</script>
